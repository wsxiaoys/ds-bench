version = "1.0"

[metadata]
tags = ["tigris", "requires_cloud_integration"]
[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
allow_internet = true
mcp_servers = []

[environment.env]
TIGRIS_STORAGE_ACCESS_KEY_ID = "${TIGRIS_STORAGE_ACCESS_KEY_ID}"
TIGRIS_STORAGE_SECRET_ACCESS_KEY = "${TIGRIS_STORAGE_SECRET_ACCESS_KEY}"
TIGRIS_STORAGE_ENDPOINT = "${TIGRIS_STORAGE_ENDPOINT}"

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 600

[verifier.env]
TIGRIS_STORAGE_ACCESS_KEY_ID = "${TIGRIS_STORAGE_ACCESS_KEY_ID}"
TIGRIS_STORAGE_SECRET_ACCESS_KEY = "${TIGRIS_STORAGE_SECRET_ACCESS_KEY}"
TIGRIS_STORAGE_ENDPOINT = "${TIGRIS_STORAGE_ENDPOINT}"

[solution.env]
