version = "1.0"

[metadata]
tags = ["convex", "requires_cloud_integration", "agent_verification", "pending"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
allow_internet = true
mcp_servers = []

[environment.env]
CONVEX_DEPLOY_KEY = "${CONVEX_DEPLOY_KEY}"
CONVEX_URL = "${CONVEX_URL}"
OPENAI_API_KEY = "${OPENAI_API_KEY}"

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 600.0

[verifier.env]
POCHI_API_KEY = "${POCHI_API_KEY}"
CONVEX_URL = "${CONVEX_URL}"

[solution.env]

