<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Fragment Page</title></head>
<body>
<h1>Fragment Page</h1>
<p>Paragraph with <strong>bold</strong>, <em>italic</em> and <code>inline code</code>.</p>
<h2>Nested lists</h2>
<ul>
  <li>outer one
    <ul><li>inner one</li><li>inner two</li></ul>
  </li>
  <li>outer two</li>
</ul>
<ol><li>step one</li><li>step two</li></ol>
<h2>Table</h2>
<table>
  <thead><tr><th>Name</th><th>Count</th><th>Note</th></tr></thead>
  <tbody>
    <tr><td>alpha</td><td>1</td><td>ok</td></tr>
    <tr><td>beta</td><td>22</td><td>fine</td></tr>
  </tbody>
</table>
<h2>Code and quotes</h2>
<pre><code>echo "hello"
exit 0
</code></pre>
<blockquote><p>Quoted paragraph with a <a href="https://example.invalid">link</a>.</p></blockquote>
<figure><img src="assets/figure.png" alt="Figure"><figcaption>Figure 1. Caption text.</figcaption></figure>
</body>
</html>
