plugins {
    id 'application'
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'com.badlogicgames.gdx:gdx:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-backend-headless:1.14.2'
}

application {
    mainClass = 'com.example.GeometryCli'
    applicationName = 'geometry-cli'
    applicationDefaultJvmArgs = []
}

// Ensure jar manifest points to the main class so we can also call via java -jar
jar {
    manifest {
        attributes 'Main-Class': 'com.example.GeometryCli'
    }
}

run {
    // Forward program args to Gradle run via --args (default in Gradle 8)
    standardInput = System.in
}
