plugins {
    id 'application'
    id 'java'
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'com.badlogicgames.gdx:gdx:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop'
    implementation 'com.badlogicgames.gdx:gdx-backend-headless:1.14.2'
}

application {
    mainClass = 'com.example.stagesim.Main'
    applicationDefaultJvmArgs = ['-Djava.awt.headless=true']
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'com.example.stagesim.Main'
    }
}
