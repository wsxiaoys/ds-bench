<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Demo</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111111;
      }
      html.dark {
        --bg: #111111;
        --fg: #ffffff;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, sans-serif;
        min-height: 100vh;
      }
      main {
        padding: 2rem;
      }
      button {
        background: var(--fg);
        color: var(--bg);
        border: 1px solid var(--fg);
        padding: 0.5rem 1rem;
        cursor: pointer;
        font-size: 1rem;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-B5_0zCMU.js"></script>
  </head>
  <body>
    <main id="app">
      <h1>Theme Demo</h1>
      <button id="theme-toggle" type="button">Toggle Theme</button>
    </main>
  </body>
</html>
