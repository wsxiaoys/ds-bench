plugins {
    id 'application'
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

configurations {
    natives
}

dependencies {
    implementation 'com.badlogicgames.gdx:gdx:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-backend-headless:1.14.2'
    natives 'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop'
}

// Make the natives available on the runtime classpath so they get extracted and discoverable.
configurations.runtimeClasspath.extendsFrom(configurations.natives)

application {
    mainClass = 'com.example.interp.Main'
}
