<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline-Aware Request Queue</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      background-color: #f5f5f7;
      color: #333;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      margin-bottom: 1.5rem;
    }
    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .status-online {
      background-color: #34c759;
    }
    .status-offline {
      background-color: #ff3b30;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover {
      background-color: #0056b3;
    }
    .list-title {
      font-weight: 600;
      font-size: 1rem;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: #f0f0f2;
      padding: 0.5rem 1rem;
      margin-bottom: 0.5rem;
      border-radius: 4px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
    }
    .received-item {
      background: #e1f5fe;
    }
  </style>
</head>
<body>
  <h1>Offline-Aware Request Queue</h1>
  
  <div class="card">
    <div style="display: flex; align-items: center; margin-bottom: 1rem;">
      <span id="status-dot" class="status-indicator status-offline"></span>
      <span id="status-text" style="font-weight: bold;">Loading status...</span>
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="msg-id">Message ID</label>
      <input type="text" id="msg-id" placeholder="e.g., msg-1">
    </div>
    <div class="form-group">
      <label for="msg-body">Message Body</label>
      <input type="text" id="msg-body" placeholder="e.g., Hello, World!">
    </div>
    <div class="form-group">
      <label for="msg-fail-times">Fail Times (optional)</label>
      <input type="number" id="msg-fail-times" placeholder="0" min="0">
    </div>
    <button id="submit-btn">Submit Message</button>
  </div>

  <div class="card">
    <div class="list-title">Pending Queue (Local)</div>
    <ul id="pending-list">
      <li>No pending messages</li>
    </ul>

    <div class="list-title">Received Messages (Server)</div>
    <ul id="received-list">
      <li>No received messages</li>
    </ul>
    
    <div style="margin-top: 1rem;">
      <button id="refresh-btn" style="background-color: #5856d6;">Refresh Server Log</button>
      <button id="reset-btn" style="background-color: #ff9500;">Reset Server Log</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
