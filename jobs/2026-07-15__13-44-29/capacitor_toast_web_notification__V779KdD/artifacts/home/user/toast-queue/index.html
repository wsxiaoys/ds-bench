<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toast Queue Manager</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <h1>Toast Queue Manager</h1>
      
      <div class="card">
        <h2>Enqueue Toast</h2>
        <div class="form-group">
          <label for="toast-text">Toast Text</label>
          <input type="text" id="toast-text" value="Hello World!" placeholder="Enter toast message" />
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="toast-duration">Duration</label>
            <select id="toast-duration">
              <option value="2000">2000 ms (Default)</option>
              <option value="short">Short (2000 ms)</option>
              <option value="long">Long (3500 ms)</option>
              <option value="1000">1000 ms</option>
              <option value="5000">5000 ms</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="toast-position">Position</label>
            <select id="toast-position">
              <option value="bottom">Bottom (Default)</option>
              <option value="top">Top</option>
              <option value="center">Center</option>
            </select>
          </div>
        </div>
        
        <div class="button-group">
          <button id="btn-enqueue" class="primary">Enqueue Toast</button>
          <button id="btn-enqueue-burst">Burst Enqueue (5 Toasts)</button>
        </div>
      </div>
      
      <div class="card">
        <h2>Queue Monitor</h2>
        <div class="monitor-grid">
          <div class="monitor-item">
            <span class="label">Pending Toasts:</span>
            <span id="state-pending" class="value">0</span>
          </div>
          <div class="monitor-item">
            <span class="label">Active State:</span>
            <span id="state-active" class="value badge-inactive">Inactive</span>
          </div>
        </div>
        
        <div class="button-group" style="margin-top: 15px;">
          <button id="btn-drain" class="secondary">Drain Queue</button>
        </div>
        <div id="drain-status" class="status-text"></div>
      </div>

      <div class="card">
        <h2>Logs</h2>
        <div id="log-console" class="log-console"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
