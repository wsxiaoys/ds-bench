<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "hconcat": [{"layer": [{"mark": {"type": "arc", "innerRadius": 20}, "encoding": {"color": {"field": "source", "legend": {"title": "Traffic Source"}, "scale": {"scheme": "tableau20"}, "type": "nominal"}, "radius": {"field": "visits", "scale": {"range": [20, 120], "type": "sqrt"}, "type": "quantitative"}, "theta": {"field": "visits", "stack": "zero", "type": "quantitative"}}}, {"mark": {"type": "text"}, "encoding": {"radius": {"value": 135}, "text": {"field": "source", "type": "nominal"}, "theta": {"field": "visits", "stack": "center", "type": "quantitative"}}}], "title": "Visits by Channel (stacked magnitude)"}, {"mark": {"type": "arc", "innerRadius": 20}, "encoding": {"color": {"field": "source", "legend": {"title": "Traffic Source"}, "scale": {"scheme": "tableau20"}, "type": "nominal"}, "theta": {"field": "visits", "stack": "normalize", "type": "quantitative"}}, "title": "Share of Total (normalized)"}], "data": {"name": "data-3f07deede9d8d3a058b32234a9617d2c"}, "title": "Website Traffic by Acquisition Channel", "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json", "datasets": {"data-3f07deede9d8d3a058b32234a9617d2c": [{"source": "Organic Search", "visits": 3120}, {"source": "Direct", "visits": 1980}, {"source": "Referral", "visits": 1520}, {"source": "Social", "visits": 1360}, {"source": "Email", "visits": 880}, {"source": "Paid Ads", "visits": 640}]}};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
