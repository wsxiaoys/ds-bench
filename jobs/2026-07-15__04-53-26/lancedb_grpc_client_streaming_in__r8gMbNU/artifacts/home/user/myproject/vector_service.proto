syntax = "proto3";

package vector_service;

// VectorService ingests vector records into LanceDB and serves nearest-neighbor search.
service VectorService {
  // IngestVectors is a client-streaming RPC that buffers streamed VectorRecord messages
  // into fixed-size batches and writes them to LanceDB.
  rpc IngestVectors(stream VectorRecord) returns (IngestSummary);

  // Search returns the ranked nearest neighbors of a query vector.
  rpc Search(SearchRequest) returns (SearchResponse);
}

// A single vector record to be ingested.
message VectorRecord {
  int32 id = 1;
  repeated float vector = 2;
  string metadata = 3;
}

// Summary of an IngestVectors RPC.
message IngestSummary {
  int32 received = 1;
  int32 written = 2;
  int32 batches = 3;
}

// Search request carrying a query vector and a k.
message SearchRequest {
  repeated float query_vector = 1;
  int32 k = 2;
}

// A single search hit.
message SearchHit {
  int32 id = 1;
  float distance = 2;
  string metadata = 3;
}

// Search response: ordered list of nearest neighbors (ascending by distance).
message SearchResponse {
  repeated SearchHit hits = 1;
}