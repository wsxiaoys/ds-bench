<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrendSearch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 24px; margin-bottom: 20px; color: #1a1a2e; }
    .layout { display: flex; gap: 20px; }
    .main { flex: 1; min-width: 0; }
    .sidebar { width: 260px; flex-shrink: 0; }
    #search-input {
      width: 100%; padding: 12px 16px; font-size: 16px;
      border: 2px solid #ddd; border-radius: 8px; outline: none;
      transition: border-color 0.2s;
    }
    #search-input:focus { border-color: #4a6cf7; }
    #results { margin-top: 20px; }
    .result-item {
      background: #fff; padding: 14px 18px; margin-bottom: 8px;
      border-radius: 8px; border: 1px solid #eee; font-size: 15px;
    }
    #no-results {
      display: none; background: #fff; padding: 20px; margin-top: 20px;
      border-radius: 8px; border: 1px solid #eee;
    }
    #no-results h3 { font-size: 16px; margin-bottom: 10px; color: #666; }
    #suggestions { list-style: none; }
    .suggestion-item {
      padding: 8px 12px; margin-bottom: 4px; background: #f0f4ff;
      border-radius: 6px; font-size: 14px; color: #4a6cf7; cursor: pointer;
    }
    .suggestion-item:hover { background: #dde4ff; }
    .trending-widget {
      background: #fff; border-radius: 8px; border: 1px solid #eee; padding: 16px;
    }
    .trending-widget h2 { font-size: 16px; margin-bottom: 12px; color: #1a1a2e; }
    #trending { list-style: none; }
    .trending-item {
      padding: 8px 10px; margin-bottom: 4px; border-radius: 6px;
      font-size: 14px; cursor: pointer; display: flex; justify-content: space-between;
      align-items: center;
    }
    .trending-item:hover { background: #f0f4ff; }
    .trending-item .query { font-weight: 500; }
    .trending-item .count {
      font-size: 12px; color: #999; background: #f0f0f0;
      padding: 2px 8px; border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TrendSearch</h1>
    <div class="layout">
      <div class="main">
        <input type="text" id="search-input" placeholder="Search products..." autofocus>
        <div id="results"></div>
        <div id="no-results">
          <h3>No results found. Did you mean:</h3>
          <ul id="suggestions"></ul>
        </div>
      </div>
      <div class="sidebar">
        <div class="trending-widget">
          <h2>Trending searches</h2>
          <ul id="trending"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('search-input');
    const resultsDiv = document.getElementById('results');
    const noResultsDiv = document.getElementById('no-results');
    const suggestionsList = document.getElementById('suggestions');
    const trendingList = document.getElementById('trending');

    async function loadTrending() {
      try {
        const resp = await fetch('/api/trending');
        const data = await resp.json();
        renderTrending(data.trending || []);
      } catch (e) {
        console.error('Failed to load trending:', e);
      }
    }

    function renderTrending(trending) {
      trendingList.innerHTML = '';
      if (trending.length === 0) {
        trendingList.innerHTML = '<li class="trending-item" style="color:#999">No trending queries yet</li>';
        return;
      }
      trending.forEach((item) => {
        const li = document.createElement('li');
        li.className = 'trending-item';
        li.innerHTML = `<span class="query">${escapeHtml(item.q)}</span><span class="count">${item.count}</span>`;
        li.addEventListener('click', () => {
          searchInput.value = item.q;
          doSearch();
        });
        trendingList.appendChild(li);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function doSearch() {
      const q = searchInput.value.trim();
      if (!q) {
        resultsDiv.innerHTML = '';
        noResultsDiv.style.display = 'none';
        return;
      }

      try {
        const resp = await fetch('/api/search?q=' + encodeURIComponent(q));
        const data = await resp.json();

        // Render results
        resultsDiv.innerHTML = '';
        if (data.hits && data.hits.length > 0) {
          data.hits.forEach((hit) => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.textContent = hit.name;
            resultsDiv.appendChild(div);
          });
        }

        // Show/hide no-results panel
        if (data.found === 0 && data.suggestions && data.suggestions.length > 0) {
          noResultsDiv.style.display = 'block';
          suggestionsList.innerHTML = '';
          data.suggestions.forEach((s) => {
            const li = document.createElement('li');
            li.className = 'suggestion-item';
            li.textContent = s;
            li.addEventListener('click', () => {
              searchInput.value = s;
              doSearch();
            });
            suggestionsList.appendChild(li);
          });
        } else {
          noResultsDiv.style.display = 'none';
        }

        // Refresh trending
        loadTrending();
      } catch (e) {
        console.error('Search error:', e);
      }
    }

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        doSearch();
      }
    });

    // Load trending on page load
    loadTrending();
  </script>
</body>
</html>
