<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typesense Collection Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.5;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 1.8rem; margin-bottom: 24px; color: #1a1a1a; }
    .stage {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .stage h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #4a90d9;
      color: #2c3e50;
    }
    .form-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .form-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    input[type="text"], textarea, select {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #4a90d9;
      box-shadow: 0 0 0 2px rgba(74,144,217,0.15);
    }
    button {
      padding: 8px 20px;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #357abd; }
    button:active { background: #2a5f9e; }
    button:disabled { background: #a0c4e8; cursor: not-allowed; }

    #field-list {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .field-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e8f0fe;
      border: 1px solid #c5d9f5;
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 0.85rem;
    }
    .field-chip .remove-field {
      background: none;
      border: none;
      color: #c0392b;
      font-size: 1rem;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    .field-chip .remove-field:hover { color: #e74c3c; }

    .status {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      font-family: "SF Mono", "Menlo", "Monaco", monospace;
      font-size: 0.85rem;
      resize: vertical;
    }

    .import-stats {
      display: flex;
      gap: 24px;
      margin-top: 12px;
    }
    .stat {
      padding: 10px 16px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .stat.imported { background: #d4edda; color: #155724; }
    .stat.rejected { background: #f8d7da; color: #721c24; }

    #search-results {
      margin-top: 16px;
    }
    .hit {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .hit .hit-title {
      font-weight: 600;
      font-size: 1rem;
      color: #2c3e50;
      margin-bottom: 6px;
    }
    .hit .hit-details {
      font-size: 0.85rem;
      color: #666;
    }
    .hit .hit-details span {
      display: inline-block;
      margin-right: 16px;
    }

    .current-collection {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 8px;
    }
    .current-collection strong {
      color: #2c3e50;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Typesense Collection Builder</h1>

  <!-- Stage 1: Schema Builder -->
  <div class="stage" id="stage-schema">
    <h2>1. Schema Builder</h2>
    <div class="form-row">
      <label for="collection-name">Base Name:</label>
      <input type="text" id="collection-name" placeholder="e.g. products" style="width: 200px;">
    </div>
    <div class="form-row">
      <label for="field-name">Field Name:</label>
      <input type="text" id="field-name" placeholder="e.g. title">
      <label for="field-type">Type:</label>
      <select id="field-type">
        <option value="string">string</option>
        <option value="int">int</option>
        <option value="float">float</option>
        <option value="bool">bool</option>
        <option value="string[]">string[]</option>
      </select>
      <label>
        <input type="checkbox" id="field-facet"> Facet
      </label>
      <label>
        <input type="checkbox" id="field-optional"> Optional
      </label>
      <button id="add-field">Add Field</button>
    </div>
    <div id="field-list"></div>
    <div style="margin-top: 16px;">
      <button id="create-collection">Create Collection</button>
    </div>
    <div id="schema-status"></div>
  </div>

  <!-- Stage 2: Bulk Import -->
  <div class="stage" id="stage-import">
    <h2>2. Bulk Import</h2>
    <div class="current-collection" id="import-collection-name" style="display:none;">
      Importing into: <strong></strong>
    </div>
    <textarea id="import-data" placeholder="Paste newline-delimited JSON documents here..."></textarea>
    <div style="margin-top: 12px;">
      <button id="import-docs">Import Documents</button>
    </div>
    <div class="import-stats">
      <div class="stat imported" id="imported-count" style="display:none;">Imported: <span>0</span></div>
      <div class="stat rejected" id="rejected-count" style="display:none;">Rejected: <span>0</span></div>
    </div>
    <div id="import-status"></div>
  </div>

  <!-- Stage 3: Search -->
  <div class="stage" id="stage-search">
    <h2>3. Search</h2>
    <div class="current-collection" id="search-collection-name" style="display:none;">
      Searching in: <strong></strong>
    </div>
    <div class="form-row">
      <input type="text" id="search-query" placeholder="Type a search query..." style="flex:1;">
      <button id="search-btn">Search</button>
    </div>
    <div id="search-results"></div>
  </div>
</div>

<script>
  (function () {
    let currentCollectionName = null;
    const fields = [];

    // --- DOM refs ---
    const $ = (id) => document.getElementById(id);

    const collectionNameInput = $("collection-name");
    const fieldNameInput = $("field-name");
    const fieldTypeSelect = $("field-type");
    const fieldFacetCheck = $("field-facet");
    const fieldOptionalCheck = $("field-optional");
    const addFieldBtn = $("add-field");
    const fieldList = $("field-list");
    const createCollectionBtn = $("create-collection");
    const schemaStatus = $("schema-status");

    const importData = $("import-data");
    const importDocsBtn = $("import-docs");
    const importedCount = $("imported-count");
    const rejectedCount = $("rejected-count");
    const importStatus = $("import-status");
    const importCollectionName = $("import-collection-name");

    const searchQuery = $("search-query");
    const searchBtn = $("search-btn");
    const searchResults = $("search-results");
    const searchCollectionName = $("search-collection-name");

    function renderFields() {
      fieldList.innerHTML = fields
        .map(
          (f, i) =>
            `<span class="field-chip">
              ${f.name} (${f.type})${f.facet ? " 🔍" : ""}${f.optional ? " ❓" : ""}
              <button class="remove-field" data-index="${i}" title="Remove">&times;</button>
            </span>`
        )
        .join("");

      // Attach remove handlers
      fieldList.querySelectorAll(".remove-field").forEach((btn) => {
        btn.addEventListener("click", function () {
          const idx = parseInt(this.dataset.index);
          fields.splice(idx, 1);
          renderFields();
        });
      });
    }

    function setStatus(el, type, message) {
      el.className = "status " + type;
      el.textContent = message;
    }

    function clearStatus(el) {
      el.className = "";
      el.textContent = "";
    }

    function setCollectionName(name) {
      currentCollectionName = name;
      if (name) {
        importCollectionName.style.display = "block";
        importCollectionName.querySelector("strong").textContent = name;
        searchCollectionName.style.display = "block";
        searchCollectionName.querySelector("strong").textContent = name;
      } else {
        importCollectionName.style.display = "none";
        searchCollectionName.style.display = "none";
      }
    }

    // --- Add Field ---
    addFieldBtn.addEventListener("click", () => {
      const name = fieldNameInput.value.trim();
      if (!name) {
        setStatus(schemaStatus, "error", "Field name is required.");
        return;
      }
      clearStatus(schemaStatus);

      fields.push({
        name: name,
        type: fieldTypeSelect.value,
        facet: fieldFacetCheck.checked,
        optional: fieldOptionalCheck.checked,
      });

      fieldNameInput.value = "";
      fieldFacetCheck.checked = false;
      fieldOptionalCheck.checked = false;
      fieldNameInput.focus();
      renderFields();
    });

    // Allow Enter to add field
    fieldNameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        addFieldBtn.click();
      }
    });

    // --- Create Collection ---
    createCollectionBtn.addEventListener("click", async () => {
      const name = collectionNameInput.value.trim();
      if (!name) {
        setStatus(schemaStatus, "error", "Collection base name is required.");
        return;
      }
      if (fields.length === 0) {
        setStatus(schemaStatus, "error", "Add at least one field.");
        return;
      }

      clearStatus(schemaStatus);
      createCollectionBtn.disabled = true;

      try {
        const res = await fetch("/api/create-collection", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, fields }),
        });
        const result = await res.json();

        if (result.success) {
          setStatus(schemaStatus, "success", result.message);
          setCollectionName(result.collectionName);
        } else {
          setStatus(schemaStatus, "error", result.error || "Failed to create collection.");
        }
      } catch (err) {
        setStatus(schemaStatus, "error", "Network error: " + err.message);
      } finally {
        createCollectionBtn.disabled = false;
      }
    });

    // --- Import ---
    importDocsBtn.addEventListener("click", async () => {
      if (!currentCollectionName) {
        setStatus(importStatus, "error", "Create a collection first.");
        return;
      }

      const data = importData.value;
      if (!data.trim()) {
        setStatus(importStatus, "error", "Paste some JSON data to import.");
        return;
      }

      clearStatus(importStatus);
      importedCount.style.display = "none";
      rejectedCount.style.display = "none";
      importDocsBtn.disabled = true;

      try {
        const res = await fetch("/api/import", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ collectionName: currentCollectionName, data }),
        });
        const result = await res.json();

        if (result.error) {
          setStatus(importStatus, "error", result.error);
        } else {
          importedCount.style.display = "block";
          importedCount.querySelector("span").textContent = result.imported;
          rejectedCount.style.display = "block";
          rejectedCount.querySelector("span").textContent = result.rejected;
          setStatus(importStatus, "success", "Import complete.");
        }
      } catch (err) {
        setStatus(importStatus, "error", "Network error: " + err.message);
      } finally {
        importDocsBtn.disabled = false;
      }
    });

    // --- Search ---
    searchBtn.addEventListener("click", async () => {
      if (!currentCollectionName) {
        searchResults.innerHTML =
          '<div class="status error">Create a collection first.</div>';
        return;
      }

      const query = searchQuery.value.trim();
      if (!query) {
        searchResults.innerHTML =
          '<div class="status error">Enter a search query.</div>';
        return;
      }

      searchResults.innerHTML = "<p>Searching...</p>";
      searchBtn.disabled = true;

      try {
        const res = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ collectionName: currentCollectionName, query }),
        });
        const result = await res.json();

        if (result.error) {
          searchResults.innerHTML =
            '<div class="status error">' + result.error + "</div>";
        } else if (result.hits.length === 0) {
          searchResults.innerHTML = "<p>No results found.</p>";
        } else {
          searchResults.innerHTML = result.hits
            .map(
              (doc) =>
                `<div class="hit">
                  <div class="hit-title">${escapeHtml(doc.title || "(no title)")}</div>
                  <div class="hit-details">
                    ${Object.entries(doc)
                      .filter(([k]) => k !== "title")
                      .map(([k, v]) => `<span><strong>${escapeHtml(k)}:</strong> ${escapeHtml(formatVal(v))}</span>`)
                      .join("")}
                  </div>
                </div>`
            )
            .join("");
        }
      } catch (err) {
        searchResults.innerHTML =
          '<div class="status error">Network error: ' + err.message + "</div>";
      } finally {
        searchBtn.disabled = false;
      }
    });

    // Allow Enter to search
    searchQuery.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        searchBtn.click();
      }
    });

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function formatVal(v) {
      if (Array.isArray(v)) return "[" + v.join(", ") + "]";
      if (typeof v === "object" && v !== null) return JSON.stringify(v);
      return String(v);
    }
  })();
</script>
</body>
</html>
