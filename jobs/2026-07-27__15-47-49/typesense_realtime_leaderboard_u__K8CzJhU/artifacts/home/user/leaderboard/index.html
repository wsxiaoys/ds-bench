<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #333;
      padding: 40px 20px;
    }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; font-size: 28px; color: #1a1a2e; }

    /* Form */
    .form-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .form-card h2 { margin-bottom: 16px; font-size: 18px; }
    .form-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 13px; font-weight: 600; color: #555; }
    .form-group input {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #4f46e5; }
    button {
      padding: 9px 20px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .status-msg { margin-top: 12px; font-size: 13px; min-height: 20px; }
    .status-msg.error { color: #dc2626; }
    .status-msg.success { color: #16a34a; }

    /* Leaderboard table */
    .leaderboard-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .table-header {
      display: grid;
      grid-template-columns: 60px 1fr 120px;
      padding: 14px 20px;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
    }
    .row {
      display: grid;
      grid-template-columns: 60px 1fr 120px;
      padding: 14px 20px;
      border-bottom: 1px solid #f3f4f6;
      align-items: center;
      transition: background 0.3s;
    }
    .row:last-child { border-bottom: none; }
    .row.flash { background: #eef2ff; }
    .row:nth-child(1) .rank { color: #f59e0b; font-weight: 800; }
    .row:nth-child(2) .rank { color: #6b7280; font-weight: 800; }
    .row:nth-child(3) .rank { color: #d97706; font-weight: 800; }
    .rank { font-size: 16px; font-weight: 600; }
    .name { font-size: 16px; font-weight: 500; }
    .score { font-size: 16px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
    .loading { text-align: center; padding: 40px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏆 Leaderboard</h1>

    <div class="form-card">
      <h2>Update Score</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="player-id">Player ID</label>
          <input type="text" id="player-id" data-testid="player-id-input" placeholder="e.g. p1" list="player-list">
          <datalist id="player-list"></datalist>
        </div>
        <div class="form-group">
          <label for="delta">Delta</label>
          <input type="number" id="delta" data-testid="delta-input" placeholder="e.g. +10" step="1">
        </div>
        <button type="submit" data-testid="submit-score" id="submit-btn">Submit</button>
      </div>
      <div class="status-msg" id="status"></div>
    </div>

    <div class="leaderboard-card">
      <div class="table-header">
        <span>Rank</span>
        <span>Player</span>
        <span style="text-align:right">Score</span>
      </div>
      <div data-testid="leaderboard" id="leaderboard">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    const leaderboardEl = document.getElementById('leaderboard');
    const playerIdInput = document.getElementById('player-id-input');
    const deltaInput = document.getElementById('delta-input');
    const submitBtn = document.getElementById('submit-score');
    const statusEl = document.getElementById('status');
    const playerList = document.getElementById('player-list');

    async function fetchLeaderboard() {
      const res = await fetch('/api/leaderboard');
      if (!res.ok) throw new Error('Failed to fetch');
      return res.json();
    }

    function renderLeaderboard(players) {
      leaderboardEl.innerHTML = players.map(p => `
        <div class="row" data-player-id="${escapeHtml(p.player_id)}">
          <span class="rank" data-testid="rank">${p.rank}</span>
          <span class="name" data-testid="name">${escapeHtml(p.name)}</span>
          <span class="score" data-testid="score">${p.score}</span>
        </div>
      `).join('');

      // Update datalist
      playerList.innerHTML = players.map(p =>
        `<option value="${escapeHtml(p.player_id)}">${escapeHtml(p.name)}</option>`
      ).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function refreshLeaderboard() {
      try {
        const data = await fetchLeaderboard();
        renderLeaderboard(data);
      } catch (err) {
        console.error('Error refreshing leaderboard:', err);
      }
    }

    // Initial load
    refreshLeaderboard();

    // SSE for live updates
    const evtSource = new EventSource('/api/events');
    evtSource.addEventListener('update', () => {
      refreshLeaderboard();
    });
    evtSource.addEventListener('connected', () => {
      console.log('SSE connected');
    });
    evtSource.onerror = () => {
      console.log('SSE connection error, will retry...');
    };

    // Form submission
    submitBtn.addEventListener('click', async () => {
      const playerId = playerIdInput.value.trim();
      const deltaStr = deltaInput.value.trim();

      if (!playerId) {
        statusEl.textContent = 'Please enter a player ID';
        statusEl.className = 'status-msg error';
        return;
      }

      const delta = parseInt(deltaStr, 10);
      if (isNaN(delta)) {
        statusEl.textContent = 'Please enter a valid integer delta';
        statusEl.className = 'status-msg error';
        return;
      }

      submitBtn.disabled = true;
      statusEl.textContent = '';
      statusEl.className = 'status-msg';

      try {
        const res = await fetch('/api/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ player_id: playerId, delta }),
        });

        if (res.ok) {
          statusEl.textContent = 'Score updated!';
          statusEl.className = 'status-msg success';
          deltaInput.value = '';
          // Leaderboard will refresh via SSE
        } else if (res.status === 404) {
          statusEl.textContent = 'Player not found';
          statusEl.className = 'status-msg error';
        } else if (res.status === 400) {
          statusEl.textContent = 'Invalid input';
          statusEl.className = 'status-msg error';
        } else {
          const data = await res.json();
          statusEl.textContent = data.error || 'Error updating score';
          statusEl.className = 'status-msg error';
        }
      } catch (err) {
        statusEl.textContent = 'Network error';
        statusEl.className = 'status-msg error';
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Allow Enter key to submit
    deltaInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitBtn.click();
    });
    playerIdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitBtn.click();
    });
  </script>
</body>
</html>
