<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge-Base Search</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles if any */
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto px-4 py-12">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight mb-3">
                Knowledge-Base Search
            </h1>
            <p class="text-lg text-gray-600">
                Keyword, Semantic, and Hybrid Search powered by Typesense
            </p>
        </header>

        <!-- Search Control Panel -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
            <div class="space-y-6">
                <!-- Query Input -->
                <div>
                    <label for="query-input" class="block text-sm font-semibold text-gray-700 mb-2">Search Query</label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="query-input" 
                            placeholder="Type your search query (e.g., speed up slow website)..." 
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-gray-900 placeholder-gray-400"
                        >
                    </div>
                </div>

                <!-- Mode & Alpha Controls -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Mode Select -->
                    <div>
                        <label for="mode-select" class="block text-sm font-semibold text-gray-700 mb-2">Search Mode</label>
                        <select 
                            id="mode-select" 
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-gray-900"
                        >
                            <option value="keyword">Keyword</option>
                            <option value="semantic">Semantic</option>
                            <option value="hybrid">Hybrid</option>
                        </select>
                    </div>

                    <!-- Alpha Slider -->
                    <div id="alpha-control" class="opacity-50 pointer-events-none transition-opacity duration-200">
                        <div class="flex justify-between items-center mb-2">
                            <label for="alpha-slider" class="text-sm font-semibold text-gray-700">
                                Hybrid Weight (Alpha)
                            </label>
                            <span id="alpha-value" class="text-xs font-bold px-2 py-1 bg-indigo-50 text-indigo-700 rounded-md">
                                0.5
                            </span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-xs text-gray-400 font-medium">Keyword (0.0)</span>
                            <input 
                                type="range" 
                                id="alpha-slider" 
                                min="0" 
                                max="1" 
                                step="0.1" 
                                value="0.5"
                                class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600 focus:outline-none"
                            >
                            <span class="text-xs text-gray-400 font-medium">Semantic (1.0)</span>
                        </div>
                    </div>
                </div>

                <!-- Search Button -->
                <div class="flex justify-end">
                    <button 
                        id="search-button" 
                        class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all flex items-center justify-center gap-2"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        Search
                    </button>
                </div>
            </div>
        </div>

        <!-- Sample Queries Suggestions -->
        <div class="mb-8">
            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider block mb-2">Try these sample queries:</span>
            <div class="flex flex-wrap gap-2">
                <button onclick="setSampleQuery('speed up slow website')" class="px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-sm text-gray-600 hover:border-indigo-500 hover:text-indigo-600 transition-all font-medium shadow-sm">
                    "speed up slow website"
                </button>
                <button onclick="setSampleQuery('how to make my app faster')" class="px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-sm text-gray-600 hover:border-indigo-500 hover:text-indigo-600 transition-all font-medium shadow-sm">
                    "how to make my app faster"
                </button>
                <button onclick="setSampleQuery('store data in tables')" class="px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-sm text-gray-600 hover:border-indigo-500 hover:text-indigo-600 transition-all font-medium shadow-sm">
                    "store data in tables"
                </button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="space-y-4">
            <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                Search Results
                <span id="results-count" class="text-xs font-semibold px-2 py-0.5 bg-gray-200 text-gray-600 rounded-full hidden">0</span>
            </h2>

            <div id="results" class="space-y-4">
                <!-- Placeholder / Initial State -->
                <div id="placeholder-state" class="text-center py-12 bg-white rounded-2xl border border-gray-100 shadow-sm">
                    <svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <p class="text-gray-500 font-medium">Enter a query and click Search to see results.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const queryInput = document.getElementById('query-input');
        const modeSelect = document.getElementById('mode-select');
        const alphaSlider = document.getElementById('alpha-slider');
        const alphaValue = document.getElementById('alpha-value');
        const alphaControl = document.getElementById('alpha-control');
        const searchButton = document.getElementById('search-button');
        const resultsContainer = document.getElementById('results');
        const resultsCount = document.getElementById('results-count');
        const placeholderState = document.getElementById('placeholder-state');

        // Update alpha slider visibility/interactivity based on selected mode
        function updateAlphaControlState() {
            if (modeSelect.value === 'hybrid') {
                alphaControl.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                alphaControl.classList.add('opacity-50', 'pointer-events-none');
            }
        }

        modeSelect.addEventListener('change', updateAlphaControlState);

        // Update displayed alpha value
        alphaSlider.addEventListener('input', () => {
            alphaValue.textContent = alphaSlider.value;
        });

        // Set sample query helper
        window.setSampleQuery = function(text) {
            queryInput.value = text;
            // If hybrid mode, make sure slider is enabled
            if (modeSelect.value === 'hybrid') {
                updateAlphaControlState();
            }
            performSearch();
        };

        // Perform Search API call
        async function performSearch() {
            const query = queryInput.value.trim();
            const mode = modeSelect.value;
            const alpha = alphaSlider.value;

            if (!query) {
                alert('Please enter a search query.');
                return;
            }

            // Show loading state
            searchButton.disabled = true;
            searchButton.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.001 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Searching...
            `;

            try {
                const url = `/api/search?q=${encodeURIComponent(query)}&mode=${mode}&alpha=${alpha}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'Failed to fetch search results');
                }

                const data = await response.json();
                renderResults(data.results);
            } catch (error) {
                console.error(error);
                resultsContainer.innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-800 rounded-xl p-4 text-center font-medium">
                        Error: ${error.message}
                    </div>
                `;
                resultsCount.classList.add('hidden');
            } finally {
                searchButton.disabled = false;
                searchButton.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    Search
                `;
            }
        }

        // Render results to DOM
        function renderResults(results) {
            resultsContainer.innerHTML = '';
            
            if (!results || results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-gray-100 shadow-sm">
                        <p class="text-gray-500 font-medium">No results found matching your query.</p>
                    </div>
                `;
                resultsCount.textContent = '0';
                resultsCount.classList.remove('hidden');
                return;
            }

            resultsCount.textContent = results.length;
            resultsCount.classList.remove('hidden');

            results.forEach(result => {
                const item = document.createElement('div');
                item.className = 'result-item bg-white rounded-2xl border border-gray-100 shadow-sm p-6 hover:shadow-md transition-all duration-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4';

                // Left side: Title & ID
                const leftDiv = document.createElement('div');
                leftDiv.className = 'flex-1';
                
                const title = document.createElement('h3');
                title.className = 'result-title text-lg font-bold text-gray-900 mb-1';
                title.textContent = result.title;

                const docId = document.createElement('span');
                docId.className = 'text-xs font-semibold px-2 py-0.5 bg-gray-100 text-gray-500 rounded-md';
                docId.textContent = `ID: ${result.id}`;

                leftDiv.appendChild(title);
                leftDiv.appendChild(docId);

                // Right side: Score
                const rightDiv = document.createElement('div');
                rightDiv.className = 'flex items-center gap-2';

                const scoreLabel = document.createElement('span');
                scoreLabel.className = 'text-xs text-gray-400 font-medium';
                scoreLabel.textContent = 'Relevance Score:';

                const score = document.createElement('span');
                score.className = 'result-score text-sm font-extrabold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg';
                // Format score nicely
                const formattedScore = typeof result.score === 'number' 
                    ? (result.score % 1 === 0 ? result.score : result.score.toFixed(4))
                    : result.score;
                score.textContent = formattedScore;

                rightDiv.appendChild(scoreLabel);
                rightDiv.appendChild(score);

                item.appendChild(leftDiv);
                item.appendChild(rightDiv);

                resultsContainer.appendChild(item);
            });
        }

        // Event listener for search button
        searchButton.addEventListener('click', performSearch);

        // Event listener for Enter key in query input
        queryInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // Initialize state
        updateAlphaControlState();
    </script>
</body>
</html>
