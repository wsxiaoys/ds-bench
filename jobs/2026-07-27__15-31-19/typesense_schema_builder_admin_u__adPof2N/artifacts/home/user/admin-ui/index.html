<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typesense Collection Builder Admin UI</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f3f4f6;
    }
    .card {
      background-color: #ffffff;
      border-radius: 0.5rem;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body class="py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- App Header -->
    <header class="text-center">
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight sm:text-4xl">
        ⚡ Typesense Collection Builder
      </h1>
      <p class="mt-2 text-sm text-gray-600">
        Design your schema, import dirty datasets, and search in real-time.
      </p>
    </header>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Left Column: Schema Builder (occupies 5 cols) -->
      <div class="lg:col-span-5 space-y-8">
        <div class="card p-6">
          <h2 class="text-xl font-bold text-gray-800 border-b pb-3 mb-4">1. Schema Builder</h2>
          
          <div class="space-y-4">
            <!-- Collection Name -->
            <div>
              <label for="collection-name" class="block text-sm font-medium text-gray-700 mb-1">Collection Base Name</label>
              <input type="text" id="collection-name" placeholder="e.g., products" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm">
            </div>

            <!-- Field Form -->
            <div class="bg-gray-50 p-4 rounded-md border border-gray-200 space-y-3">
              <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Add Schema Field</h3>
              
              <div>
                <label for="field-name" class="block text-xs font-medium text-gray-700 mb-1">Field Name</label>
                <input type="text" id="field-name" placeholder="e.g., price" class="w-full px-2 py-1 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-xs">
              </div>

              <div>
                <label for="field-type" class="block text-xs font-medium text-gray-700 mb-1">Field Type</label>
                <select id="field-type" class="w-full px-2 py-1 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-xs bg-white">
                  <option value="string">string</option>
                  <option value="int">int</option>
                  <option value="float">float</option>
                  <option value="bool">bool</option>
                  <option value="string[]">string[]</option>
                </select>
              </div>

              <div class="flex items-center space-x-4 pt-1">
                <label class="flex items-center text-xs text-gray-700 cursor-pointer">
                  <input type="checkbox" id="field-facet" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded mr-1.5">
                  Facet
                </label>
                <label class="flex items-center text-xs text-gray-700 cursor-pointer">
                  <input type="checkbox" id="field-optional" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded mr-1.5">
                  Optional
                </label>
              </div>

              <button type="button" id="add-field" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-1.5 px-3 rounded text-xs transition duration-150">
                + Add Field to List
              </button>
            </div>

            <!-- Pending Field List -->
            <div>
              <span class="block text-sm font-medium text-gray-700 mb-2">Pending Fields</span>
              <div id="field-list" class="border border-gray-200 rounded-md p-3 min-h-[100px] max-h-[220px] overflow-y-auto bg-gray-50 space-y-2 text-xs">
                <!-- Dynamic pending fields will appear here -->
                <div class="text-gray-400 text-center py-6">No fields added yet.</div>
              </div>
            </div>

            <!-- Create Collection Button & Status -->
            <div class="pt-2 border-t border-gray-200">
              <button type="button" id="create-collection" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded text-sm transition duration-150">
                Create Collection
              </button>
              <div id="schema-status" class="mt-3 text-sm p-3 rounded hidden"></div>
            </div>

          </div>
        </div>
      </div>

      <!-- Right Column: Import & Search (occupies 7 cols) -->
      <div class="lg:col-span-7 space-y-8">
        
        <!-- Bulk Import Card -->
        <div class="card p-6">
          <h2 class="text-xl font-bold text-gray-800 border-b pb-3 mb-4">2. Bulk Import Dirty Data</h2>
          
          <div class="space-y-4">
            <div>
              <label for="import-data" class="block text-sm font-medium text-gray-700 mb-1">Paste Newline-Delimited JSON (JSONL)</label>
              <textarea id="import-data" rows="6" placeholder='{"id":"p1","title":"Wireless Mouse","price":"29.99","in_stock":true}&#10;{"id":"p2","title":"Keyboard","price":89.99,"in_stock":"false"}' class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-xs font-mono"></textarea>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pt-2">
              <button type="button" id="import-docs" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded text-sm transition duration-150">
                Import Documents
              </button>
              
              <!-- Stats display -->
              <div class="flex items-center space-x-4 text-xs font-medium text-gray-700">
                <div class="bg-green-100 text-green-800 px-3 py-1.5 rounded-full">
                  Imported: <span id="imported-count" class="font-bold">0</span>
                </div>
                <div class="bg-red-100 text-red-800 px-3 py-1.5 rounded-full">
                  Rejected: <span id="rejected-count" class="font-bold">0</span>
                </div>
              </div>
            </div>

            <div id="import-status" class="text-sm p-3 rounded hidden"></div>
          </div>
        </div>

        <!-- Search Card -->
        <div class="card p-6">
          <h2 class="text-xl font-bold text-gray-800 border-b pb-3 mb-4">3. Instant Search</h2>
          
          <div class="space-y-4">
            <div class="flex gap-2">
              <input type="text" id="search-query" placeholder="Type search term..." class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm">
              <button type="button" id="search-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded text-sm transition duration-150">
                Search
              </button>
            </div>

            <div>
              <span class="block text-sm font-medium text-gray-700 mb-2">Search Results</span>
              <div id="search-results" class="border border-gray-200 rounded-md p-4 min-h-[150px] max-h-[350px] overflow-y-auto bg-gray-50 space-y-3">
                <div class="text-gray-400 text-center py-10 text-sm">Search results will be displayed here.</div>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    // Pending fields state
    let pendingFields = [];

    // DOM Elements
    const collectionNameInput = document.getElementById('collection-name');
    const fieldNameInput = document.getElementById('field-name');
    const fieldTypeSelect = document.getElementById('field-type');
    const fieldFacetCheckbox = document.getElementById('field-facet');
    const fieldOptionalCheckbox = document.getElementById('field-optional');
    const addFieldBtn = document.getElementById('add-field');
    const fieldListContainer = document.getElementById('field-list');
    const createCollectionBtn = document.getElementById('create-collection');
    const schemaStatusEl = document.getElementById('schema-status');

    const importDataTextarea = document.getElementById('import-data');
    const importDocsBtn = document.getElementById('import-docs');
    const importedCountEl = document.getElementById('imported-count');
    const rejectedCountEl = document.getElementById('rejected-count');
    const importStatusEl = document.getElementById('import-status');

    const searchQueryInput = document.getElementById('search-query');
    const searchBtn = document.getElementById('search-btn');
    const searchResultsContainer = document.getElementById('search-results');

    // Utility function to escape HTML to prevent XSS
    function escapeHTML(str) {
      if (typeof str !== 'string') return String(str || '');
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // Render pending field list
    function renderFieldList() {
      fieldListContainer.innerHTML = '';
      if (pendingFields.length === 0) {
        fieldListContainer.innerHTML = '<div class="text-gray-400 text-center py-6">No fields added yet.</div>';
        return;
      }

      pendingFields.forEach((field, index) => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-white p-2.5 rounded border border-gray-200 shadow-sm';
        item.innerHTML = `
          <div class="space-y-0.5">
            <span class="font-bold text-gray-800">${escapeHTML(field.name)}</span>
            <span class="text-gray-500 ml-1.5 bg-gray-100 px-1.5 py-0.5 rounded text-[10px] font-mono">${field.type}</span>
            <div class="flex space-x-2 mt-0.5">
              ${field.facet ? '<span class="text-blue-600 font-semibold text-[9px] uppercase tracking-wider">Facet</span>' : ''}
              ${field.optional ? '<span class="text-purple-600 font-semibold text-[9px] uppercase tracking-wider">Optional</span>' : '<span class="text-red-500 font-semibold text-[9px] uppercase tracking-wider">Required</span>'}
            </div>
          </div>
          <button type="button" class="text-red-500 hover:text-red-700 font-bold px-2 py-1 text-xs" onclick="removeField(${index})">
            Remove
          </button>
        `;
        fieldListContainer.appendChild(item);
      });
    }

    // Global function to remove field
    window.removeField = function(index) {
      pendingFields.splice(index, 1);
      renderFieldList();
    };

    // Add field button handler
    addFieldBtn.addEventListener('click', () => {
      const name = fieldNameInput.value.trim();
      const type = fieldTypeSelect.value;
      const facet = fieldFacetCheckbox.checked;
      const optional = fieldOptionalCheckbox.checked;

      // Reset status
      schemaStatusEl.classList.add('hidden');

      if (!name) {
        showSchemaStatus('Field name cannot be empty.', false);
        return;
      }

      if (!/^[a-zA-Z0-9_]+$/.test(name)) {
        showSchemaStatus('Field name can only contain letters, numbers, and underscores.', false);
        return;
      }

      if (pendingFields.some(f => f.name.toLowerCase() === name.toLowerCase())) {
        showSchemaStatus(`Field with name "${name}" already exists in pending list.`, false);
        return;
      }

      pendingFields.push({ name, type, facet, optional });
      renderFieldList();

      // Reset inputs
      fieldNameInput.value = '';
      fieldFacetCheckbox.checked = false;
      fieldOptionalCheckbox.checked = false;
    });

    // Show Schema Status Helper
    function showSchemaStatus(message, isSuccess) {
      schemaStatusEl.innerHTML = escapeHTML(message);
      schemaStatusEl.className = `mt-3 text-sm p-3 rounded ${isSuccess ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-red-100 text-red-800 border border-red-200'}`;
    }

    // Create Collection
    createCollectionBtn.addEventListener('click', async () => {
      const collectionName = collectionNameInput.value.trim();
      
      schemaStatusEl.classList.add('hidden');

      if (!collectionName) {
        showSchemaStatus('Collection base name is required.', false);
        return;
      }

      if (!/^[a-zA-Z0-9_]+$/.test(collectionName)) {
        showSchemaStatus('Collection base name can only contain letters, numbers, and underscores.', false);
        return;
      }

      if (pendingFields.length === 0) {
        showSchemaStatus('Please add at least one field to your schema.', false);
        return;
      }

      // Check for duplicate field names
      const names = pendingFields.map(f => f.name.toLowerCase());
      const hasDuplicates = names.some((val, i) => names.indexOf(val) !== i);
      if (hasDuplicates) {
        showSchemaStatus('The schema contains fields with duplicate names.', false);
        return;
      }

      try {
        schemaStatusEl.innerHTML = 'Creating collection...';
        schemaStatusEl.className = 'mt-3 text-sm p-3 rounded bg-blue-100 text-blue-800 border border-blue-200';
        schemaStatusEl.classList.remove('hidden');

        const res = await fetch('/api/collection', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: collectionName, fields: pendingFields })
        });

        const data = await res.json();

        if (res.ok) {
          showSchemaStatus(`Collection "${collectionName}" created successfully!`, true);
        } else {
          showSchemaStatus(data.error || 'Failed to create collection.', false);
        }
      } catch (err) {
        showSchemaStatus(`Error: ${err.message}`, false);
      }
    });

    // Import Status Helper
    function showImportStatus(message, isSuccess) {
      importStatusEl.innerHTML = escapeHTML(message);
      importStatusEl.className = `text-sm p-3 rounded ${isSuccess ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-red-100 text-red-800 border border-red-200'}`;
      importStatusEl.classList.remove('hidden');
    }

    // Import Documents
    importDocsBtn.addEventListener('click', async () => {
      const collectionName = collectionNameInput.value.trim();
      const importData = importDataTextarea.value;

      importStatusEl.classList.add('hidden');

      if (!collectionName) {
        showImportStatus('Please specify the Collection Base Name first.', false);
        return;
      }

      if (!importData.trim()) {
        showImportStatus('Please enter some data to import.', false);
        return;
      }

      try {
        importStatusEl.innerHTML = 'Importing documents...';
        importStatusEl.className = 'text-sm p-3 rounded bg-blue-100 text-blue-800 border border-blue-200';
        importStatusEl.classList.remove('hidden');

        const res = await fetch('/api/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: collectionName, data: importData })
        });

        const data = await res.json();

        if (res.ok) {
          importedCountEl.innerText = data.importedCount;
          rejectedCountEl.innerText = data.rejectedCount;
          showImportStatus('Import completed successfully!', true);
        } else {
          showImportStatus(data.error || 'Failed to import documents.', false);
        }
      } catch (err) {
        showImportStatus(`Error: ${err.message}`, false);
      }
    });

    // Search Documents
    searchBtn.addEventListener('click', async () => {
      const collectionName = collectionNameInput.value.trim();
      const query = searchQueryInput.value;

      if (!collectionName) {
        searchResultsContainer.innerHTML = '<div class="text-red-500 text-center py-10 text-sm">Please specify the Collection Base Name first.</div>';
        return;
      }

      try {
        searchResultsContainer.innerHTML = '<div class="text-gray-400 text-center py-10 text-sm">Searching...</div>';

        const res = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: collectionName, q: query })
        });

        const data = await res.json();

        if (res.ok) {
          searchResultsContainer.innerHTML = '';
          const hits = data.hits || [];

          if (hits.length === 0) {
            searchResultsContainer.innerHTML = '<div class="text-gray-400 text-center py-10 text-sm">No matching documents found.</div>';
            return;
          }

          hits.forEach(doc => {
            const hitEl = document.createElement('div');
            hitEl.className = 'hit p-4 bg-white border border-gray-200 rounded-md shadow-sm space-y-1 hover:border-indigo-300 transition duration-150';
            
            // Highlight title clearly
            let detailsHtml = '';
            for (const key in doc) {
              if (key !== 'title' && key !== 'id') {
                detailsHtml += `
                  <span class="inline-block bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded mr-1.5 mb-1">
                    <strong class="text-gray-700">${escapeHTML(key)}:</strong> ${escapeHTML(JSON.stringify(doc[key]))}
                  </span>
                `;
              }
            }

            hitEl.innerHTML = `
              <div class="flex items-center justify-between">
                <h4 class="font-bold text-gray-900 text-sm">${escapeHTML(doc.title || 'Untitled')}</h4>
                <span class="text-gray-400 text-[10px] font-mono">${escapeHTML(doc.id || '')}</span>
              </div>
              <div class="pt-1.5 flex flex-wrap">
                ${detailsHtml}
              </div>
            `;
            searchResultsContainer.appendChild(hitEl);
          });
        } else {
          searchResultsContainer.innerHTML = `<div class="text-red-500 text-center py-10 text-sm">Error: ${escapeHTML(data.error || 'Failed to search.')}</div>`;
        }
      } catch (err) {
        searchResultsContainer.innerHTML = `<div class="text-red-500 text-center py-10 text-sm">Error: ${escapeHTML(err.message)}</div>`;
      }
    });

    // Support search on Enter key
    searchQueryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        searchBtn.click();
      }
    });
  </script>
</body>
</html>
