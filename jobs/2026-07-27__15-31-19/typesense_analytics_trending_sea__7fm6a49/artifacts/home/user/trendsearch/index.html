<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trending Searches Analytics UI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    #search-form {
      margin-bottom: 20px;
    }
    #search-input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
    }
    .result-item {
      padding: 10px;
      border-bottom: 1px solid #ccc;
    }
    .trending-item {
      padding: 5px;
      cursor: pointer;
      color: blue;
      text-decoration: underline;
    }
    .suggestion-item {
      padding: 5px;
      cursor: pointer;
      color: green;
      text-decoration: underline;
    }
    #no-results {
      background-color: #f9f9f9;
      padding: 15px;
      border: 1px solid #ddd;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Product Search</h1>
  
  <form id="search-form">
    <input type="text" id="search-input" placeholder="Search products..." autocomplete="off">
  </form>

  <div id="no-results" style="display: none;">
    <h3>No products found. Did you mean?</h3>
    <ul id="suggestions"></ul>
  </div>

  <h2>Results</h2>
  <div id="results"></div>

  <h2>Trending Searches</h2>
  <div id="trending"></div>

  <script>
    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('search-input');
    const resultsContainer = document.getElementById('results');
    const noResultsPanel = document.getElementById('no-results');
    const suggestionsList = document.getElementById('suggestions');
    const trendingContainer = document.getElementById('trending');

    // Function to load and render trending searches
    async function loadTrending() {
      try {
        const res = await fetch('/api/trending');
        const data = await res.json();
        trendingContainer.innerHTML = '';
        (data.trending || []).forEach(item => {
          const div = document.createElement('div');
          div.className = 'trending-item';
          div.textContent = item.q;
          div.onclick = () => {
            searchInput.value = item.q;
            performSearch(item.q);
          };
          trendingContainer.appendChild(div);
        });
      } catch (err) {
        console.error('Error loading trending searches:', err);
      }
    }

    // Function to execute search
    async function performSearch(query) {
      try {
        const res = await fetch('/api/search?q=' + encodeURIComponent(query));
        const data = await res.json();
        
        // Render results
        resultsContainer.innerHTML = '';
        if (data.found > 0) {
          noResultsPanel.style.display = 'none';
          data.hits.forEach(product => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.textContent = product.name + ' - $' + product.price;
            resultsContainer.appendChild(div);
          });
        } else {
          noResultsPanel.style.display = 'block';
          suggestionsList.innerHTML = '';
          (data.suggestions || []).forEach(suggestion => {
            const li = document.createElement('li');
            li.className = 'suggestion-item';
            li.textContent = suggestion;
            li.onclick = () => {
              searchInput.value = suggestion;
              performSearch(suggestion);
            };
            suggestionsList.appendChild(li);
          });
        }

        // Refresh trending widget after search
        await loadTrending();
      } catch (err) {
        console.error('Error executing search:', err);
      }
    }

    // Form submission
    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      performSearch(searchInput.value);
    });

    // Initial load
    loadTrending();
  </script>
</body>
</html>
