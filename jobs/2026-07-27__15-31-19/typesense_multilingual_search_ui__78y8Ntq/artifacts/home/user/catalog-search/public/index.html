<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multilingual Catalog Search</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f9fafb;
      --card-bg: #ffffff;
      --text-color: #111827;
      --text-secondary: #4b5563;
      --border-color: #d1d5db;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    h1 {
      font-size: 1.75rem;
      margin-top: 0;
      margin-bottom: 1.5rem;
      text-align: center;
      color: var(--primary-color);
    }

    .search-controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    #language-select {
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--card-bg);
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    #language-select:focus {
      border-color: var(--primary-color);
    }

    #search-input {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    #search-input:focus {
      border-color: var(--primary-color);
    }

    #results {
      list-style: none;
      padding: 0;
      margin: 0;
      border-top: 1px solid var(--border-color);
    }

    .result-item {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      font-size: 1.1rem;
      transition: background-color 0.2s;
    }

    .result-item:hover {
      background-color: #f3f4f6;
    }

    .no-results {
      padding: 1.5rem;
      text-align: center;
      color: var(--text-secondary);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Catalog Search</h1>
    <div class="search-controls">
      <select id="language-select">
        <option value="en" selected>English</option>
        <option value="fr">French</option>
        <option value="de">German</option>
      </select>
      <input type="text" id="search-input" placeholder="Search catalog..." autofocus autocomplete="off">
    </div>
    <ul id="results"></ul>
  </div>

  <script>
    const searchInput = document.getElementById('search-input');
    const languageSelect = document.getElementById('language-select');
    const resultsUl = document.getElementById('results');

    async function performSearch() {
      const q = searchInput.value;
      const lang = languageSelect.value;

      if (!q || !q.trim()) {
        resultsUl.innerHTML = '';
        return;
      }

      try {
        const url = `/api/search?q=${encodeURIComponent(q)}&lang=${encodeURIComponent(lang)}`;
        const res = await fetch(url);
        const data = await res.json();

        resultsUl.innerHTML = '';
        if (data.hits && data.hits.length > 0) {
          data.hits.forEach(hit => {
            const li = document.createElement('li');
            li.className = 'result-item';
            li.setAttribute('data-doc-id', hit.id);
            li.textContent = hit.name;
            resultsUl.appendChild(li);
          });
        } else {
          const li = document.createElement('li');
          li.className = 'no-results';
          li.textContent = 'No matching items found';
          resultsUl.appendChild(li);
        }
      } catch (err) {
        console.error('Error fetching search results:', err);
      }
    }

    searchInput.addEventListener('input', performSearch);
    languageSelect.addEventListener('change', performSearch);
  </script>
</body>
</html>
