plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.badlogicgames.gdx:gdx:1.13.1'
    implementation 'com.badlogicgames.gdx:gdx-backend-headless:1.13.1'
    // Native desktop natives are required for libGDX even when running headless on some JVM paths.
    // The LWJGL3 / desktop GL backends must NOT be on the runtime classpath.
    implementation 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-desktop'
    implementation 'com.badlogicgames.ashley:ashley:1.7.4'
}

application {
    mainClass = 'com.example.gdxecs.Main'
}

// We build a runnable "fat" jar with the application plugin; nothing else is needed.
// We deliberately do NOT pull Lwjgl3Backend / Desktop module so the runtime classpath stays headless-only.

tasks.named('jar') {
    manifest {
        attributes('Main-Class': 'com.example.gdxecs.Main')
    }
}
