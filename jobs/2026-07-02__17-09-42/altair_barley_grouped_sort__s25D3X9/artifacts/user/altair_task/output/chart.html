<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"url": "https://cdn.jsdelivr.net/npm/vega-datasets@v3.2.1/data/barley.json"}, "facet": {"column": {"field": "year", "title": "Year", "type": "ordinal"}}, "spec": {"layer": [{"mark": {"type": "bar"}, "encoding": {"color": {"field": "variety", "scale": {"scheme": "tableau10"}, "title": "Variety", "type": "nominal"}, "tooltip": [{"field": "site", "title": "Site", "type": "nominal"}, {"field": "variety", "title": "Variety", "type": "nominal"}, {"aggregate": "mean", "field": "yield", "format": ".2f", "title": "Mean Yield", "type": "quantitative"}], "x": {"field": "site", "sort": {"field": "yield", "op": "mean", "order": "descending"}, "title": "Site", "type": "nominal"}, "xOffset": {"field": "variety", "title": "Variety", "type": "nominal"}, "y": {"aggregate": "mean", "field": "yield", "title": "Mean Yield", "type": "quantitative"}}, "name": "bars"}, {"mark": {"type": "tick", "color": "black", "size": 40, "thickness": 2}, "encoding": {"tooltip": [{"field": "site", "title": "Site", "type": "nominal"}, {"field": "mean_yield", "title": "Per-site mean yield", "type": "quantitative"}], "x": {"field": "site", "sort": {"field": "yield", "op": "mean", "order": "descending"}, "title": "Site", "type": "nominal"}, "y": {"field": "mean_yield", "title": "Mean Yield (per-site)", "type": "quantitative"}}, "name": "site_means", "transform": [{"aggregate": [{"op": "mean", "field": "yield", "as": "mean_yield"}], "groupby": ["site", "year"]}]}]}, "description": "Faceted grouped bar chart of mean barley yield per (site, variety), with a per-site mean tick overlay, using Altair's ``barley`` dataset.", "resolve": {"scale": {"y": "independent"}}, "title": {"text": "Barley Yield by Site and Variety", "subtitle": "Grouped bars: mean yield per (site, variety); black tick: per-site mean across varieties."}, "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json"};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
