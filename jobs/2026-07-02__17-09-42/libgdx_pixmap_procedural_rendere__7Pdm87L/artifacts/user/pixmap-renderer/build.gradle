plugins {
    id 'java'
    id 'application'
}

// Use the JVM that Gradle is running on so the build works offline without a toolchain install.
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.badlogicgames.gdx:gdx:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-backend-headless:1.14.2'
    runtimeOnly 'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop'
}

application {
    mainClass = 'com.pochi.pixmaprenderer.HeadlessPixmapLauncher'
    // Default JVM args for the run task. Keep headless rendering deterministic.
    applicationDefaultJvmArgs = [
        '-Djava.awt.headless=true',
        '-Dfile.encoding=UTF-8',
        '-Dorg.gradle.daemon=false'
    ]
}

// Convenience task that exposes the run task with no daemon / offline so run.sh can just call it.
run {
    standardInput = System.in
}
