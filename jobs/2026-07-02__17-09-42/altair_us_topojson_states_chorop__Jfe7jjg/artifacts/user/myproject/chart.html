<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>US Engineers Choropleth</title>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    #vis.vega-embed { width: 100%; display: flex; }
    #vis.vega-embed details,
    #vis.vega-embed details summary { position: relative; }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script type="application/json" id="vega-lite-spec">
{
  "config": {
    "view": {
      "continuousWidth": 300,
      "continuousHeight": 300
    }
  },
  "data": {
    "url": "https://cdn.jsdelivr.net/npm/vega-datasets@v1.29.0/data/us-10m.json",
    "format": {
      "feature": "states",
      "type": "topojson"
    }
  },
  "mark": {
    "type": "geoshape",
    "stroke": "white",
    "strokeWidth": 0.5
  },
  "encoding": {
    "color": {
      "field": "engineers",
      "legend": {
        "title": "Engineers"
      },
      "scale": {
        "scheme": "blues"
      },
      "title": "Engineers",
      "type": "quantitative"
    },
    "tooltip": [
      {
        "field": "state",
        "title": "State",
        "type": "nominal"
      },
      {
        "field": "engineers",
        "format": ".4f",
        "title": "Engineers",
        "type": "quantitative"
      }
    ]
  },
  "height": 400,
  "projection": {
    "type": "albersUsa"
  },
  "title": "US Engineers by State",
  "transform": [
    {
      "lookup": "id",
      "from": {
        "data": {
          "url": "https://cdn.jsdelivr.net/npm/vega-datasets@v1.29.0/data/population_engineers_hurricanes.csv"
        },
        "key": "id",
        "fields": [
          "engineers",
          "state"
        ]
      }
    }
  ],
  "width": 700,
  "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json"
}
  </script>
  <script type="text/javascript">
    (function() {
      const spec = JSON.parse(
        document.getElementById('vega-lite-spec').textContent
      );
      const el = document.getElementById('vis');
      function showError(error) {
        el.innerHTML = (
          '<div style="color:red;">' +
          '<p>JavaScript Error: ' + error.message + '</p>' +
          '<p>This usually means there is a typo in the chart specification. ' +
          'See the browser console for the full traceback.</p>' +
          '</div>'
        );
        throw error;
      }
      vegaEmbed('#vis', spec, { mode: 'vega-lite' }).catch(showError);
    })();
  </script>
</body>
</html>
