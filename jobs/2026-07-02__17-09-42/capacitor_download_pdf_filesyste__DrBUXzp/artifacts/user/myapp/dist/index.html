<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filesystem Demo</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 2rem REDACTED;
        max-width: 640px;
        padding: 0 1rem;
        color: #222;
      }
      h1 {
        margin-top: 0;
      }
      button {
        font-size: 1rem;
        padding: 0.6rem 1.2rem;
        cursor: pointer;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.25rem 1rem;
        margin-top: 1.5rem;
      }
      dt {
        font-weight: 600;
      }
      dd {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        word-break: break-all;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-DQLQRBH9.js"></script>
  </head>
  <body>
    <main id="app">
      <h1>Filesystem Demo</h1>

      <p>
        This page downloads <code>/sample.pdf</code>, persists it to the
        device's Documents directory via <code>@capacitor/filesystem</code>, and
        then reads the file back to verify it was actually saved.
      </p>

      <button id="download-pdf" type="button">Download PDF</button>

      <dl>
        <dt>Status</dt>
        <dd id="download-status">idle</dd>

        <dt>Saved size (bytes)</dt>
        <dd id="file-size">-</dd>

        <dt>SHA-256</dt>
        <dd id="file-sha256">-</dd>
      </dl>
    </main>
  </body>
</html>
