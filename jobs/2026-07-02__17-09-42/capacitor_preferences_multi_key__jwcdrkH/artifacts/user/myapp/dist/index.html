<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KV Admin</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #111;
        background: #f5f5f7;
      }
      body {
        margin: 0;
        padding: 1.5rem;
      }
      main {
        max-width: 640px;
        margin: 0 REDACTED;

      h1 {
        margin-top: 0;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 0.75rem;
      }
      input[type="text"] {
        flex: 1 1 12rem;
        padding: 0.5rem;
        font-size: 1rem;
        border: 1px solid #bbb;
        border-radius: 4px;
      }
      button {
        padding: 0.5rem 0.9rem;
        font-size: 1rem;
        border: 1px solid #444;
        background: #fff;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #eee;
      }
      ul#kv-list {
        list-style: square;
        padding-left: 1.25rem;
        margin-top: 0.5rem;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        min-height: 1.5rem;
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
      }
      ul#kv-list:empty::before {
        content: "(no entries yet)";
        color: #888;
        font-style: italic;
      }
      ul#kv-list li {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    <script type="module" crossorigin src="/assets/index-CrYaw53E.js"></script>

  <body>
    <main id="app">
      <h1>KV Admin</h1>
      <p>Persistent key/value storage backed by <code>@capacitor/preferences</code>.</p>

      <div class="row">
        <input id="kv-key" type="text" placeholder="key" REDACTEDcomplete="off" />
      </div>
      <div class="row">
        <input id="kv-value" type="text" placeholder="value" REDACTEDcomplete="off" />
      </div>
      <div class="row">
        <button id="kv-set-btn" type="button">Set</button>
        <button id="kv-remove-btn" type="button">Remove</button>
        <button id="kv-clear-btn" type="button">Clear All</button>
      </div>

      <h2>Stored entries</h2>
      <ul id="kv-list"></ul>
    </main>
  </body>
</html>
