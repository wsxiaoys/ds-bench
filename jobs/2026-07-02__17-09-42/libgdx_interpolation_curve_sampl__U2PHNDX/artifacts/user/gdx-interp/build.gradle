plugins {
    id 'application'
    id 'java'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    gdxVersion = '1.14.2'
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-backend-headless:${gdxVersion}"
    // libGDX uses SharedLibraryLoader to extract the natives from a JAR
    // accessible on the classpath, so the natives JAR must be on the
    // runtime classpath (not just java.library.path).
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
}

application {
    mainClass = 'com.example.interp.Main'
}

run {
    standardInput = System.in
}