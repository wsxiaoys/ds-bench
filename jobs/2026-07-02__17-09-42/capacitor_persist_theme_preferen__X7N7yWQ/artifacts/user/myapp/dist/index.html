<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Demo</title>
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #111111;
        --button-bg: #f0f0f0;
        --button-text: #111111;
        --button-border: #cccccc;
      }

      html[data-theme="dark"] {
        --bg-color: #111111;
        --text-color: #f5f5f5;
        --button-bg: #222222;
        --button-text: #f5f5f5;
        --button-border: #444444;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        min-height: 100vh;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      #app {
        max-width: 640px;
        margin: 0 REDACTED;
        padding: 2rem 1.25rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

      #theme-toggle {
        appearance: none;
        border: 1px solid var(--button-border);
        background-color: var(--button-bg);
        color: var(--button-text);
        padding: 0.6rem 1.1rem;
        font-size: 1rem;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s ease, color 0.2s ease,
          border-color 0.2s ease;
      }

      #theme-toggle:hover {
        filter: brightness(1.1);
      }
    </style>
    <script type="module" crossorigin src="/assets/index-SuFjWBUa.js"></script>
  </head>
  <body>
    <main id="app">
      <h1>Theme Demo</h1>
      <p>
        Click the button below to toggle between light and dark themes. Your
        selection is stored with Capacitor Preferences and restored on the next
        load.
      </p>
      <button id="theme-toggle" type="button">Toggle Theme</button>
      <p id="current-theme">Current theme: light</p>
    </main>
  </body>
</html>
