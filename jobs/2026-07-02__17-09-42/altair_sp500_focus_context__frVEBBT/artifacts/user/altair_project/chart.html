<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "vconcat": [{"layer": [{"data": {"url": "https://cdn.jsdelivr.net/npm/vega-datasets@v1.29.0/data/sp500.csv"}, "mark": {"type": "area"}, "encoding": {"x": {"field": "date", "scale": {"domain": {"param": "param_c97a99acfc68b794"}}, "title": "Date (detail window)", "type": "temporal"}, "y": {"field": "price", "title": "Price", "type": "quantitative"}}, "title": "S&P 500 \u2014 Focus + Context"}, {"data": {"url": "https://cdn.jsdelivr.net/npm/vega-datasets@v1.29.0/data/sp500.csv"}, "mark": {"type": "rule", "color": "crimson", "strokeDash": [4, 3], "strokeWidth": 2}, "encoding": {"y": {"field": "max_price", "title": "Max price in window", "type": "quantitative"}}, "transform": [{"filter": {"param": "param_c97a99acfc68b794"}}, {"aggregate": [{"op": "max", "field": "price", "as": "max_price"}]}]}], "height": 400, "width": 600}, {"data": {"url": "https://cdn.jsdelivr.net/npm/vega-datasets@v1.29.0/data/sp500.csv"}, "mark": {"type": "area"}, "encoding": {"x": {"field": "date", "title": "Date", "type": "temporal"}, "y": {"field": "price", "title": "Price", "type": "quantitative"}}, "height": 60, "name": "view_3fcb6ff21a506dc0_1", "title": "Drag a range to zoom the detail chart", "width": 600}], "params": [{"name": "param_c97a99acfc68b794", "select": {"type": "interval", "encodings": ["x"]}, "views": ["view_3fcb6ff21a506dc0_1"]}], "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json"};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
