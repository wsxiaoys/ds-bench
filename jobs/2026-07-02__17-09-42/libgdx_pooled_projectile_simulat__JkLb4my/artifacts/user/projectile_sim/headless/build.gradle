plugins {
    id 'application'
    id 'java'
}

java {
    // Compile against Java 17 bytecode (broadly compatible with the libGDX
    // 1.14.x runtime) but use the host JDK to avoid having to provision a
    // separate toolchain.  Java 21 can still consume Java 17 class files
    // because we don't enable preview features here.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    // The launcher parses args from --scenario / --output directly, so the
    // default Gradle application args are intentionally empty.
    applicationDefaultJvmArgs = []
    mainClass = 'com.example.projectilesim.Launcher'
}

dependencies {
    // libGDX core (math, utils, Pool, Vector2, ...).
    implementation 'com.badlogicgames.gdx:gdx:1.14.2'
    // Headless backend hosting ApplicationListener without OpenGL.
    implementation 'com.badlogicgames.gdx:gdx-backend-headless:1.14.2'
    // Desktop natives (used by HeadlessApplication internals on Linux/macOS/Windows).
    implementation 'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop'
}

run {
    // Pass through --scenario / --output from run.sh. We don't standardize on
    // standardInput because the application reads scenario/output paths itself.
    standardInput = System.in
}
