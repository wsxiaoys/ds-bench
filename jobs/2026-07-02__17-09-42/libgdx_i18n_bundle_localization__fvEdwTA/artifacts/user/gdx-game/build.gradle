plugins {
    id 'application'
    id 'java-library'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    gdxVersion = '1.14.2'
}

dependencies {
    api "com.badlogicgames.gdx:gdx:${gdxVersion}"
    api "com.badlogicgames.gdx:gdx-backend-headless:${gdxVersion}"
    api "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
}

application {
    mainClass = 'com.example.gdxgame.Launcher'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources', 'assets']
        }
    }
}

run {
    standardInput = System.in
}

tasks.named('jar') {
    manifest {
        attributes(
            'Main-Class': 'com.example.gdxgame.Launcher'
        )
    }
}

tasks.register('runApp', JavaExec) {
    group = 'application'
    description = 'Runs the headless libGDX I18NBundle console with --input=<file>'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.gdxgame.Launcher'
}