<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saved Searches — New-Match Alerts</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Saved Searches <span class="subtitle">New-Match Alerts</span></h1>
  </header>

  <main>
    <section class="panel" id="create-panel">
      <h2>Create a saved search</h2>
      <form id="create-form">
        <label>
          Name
          <input type="text" id="f-name" required placeholder="e.g. Cheap electronics" />
        </label>
        <label>
          Query
          <input type="text" id="f-q" placeholder="free text, or leave blank / * for all" />
        </label>
        <label>
          Category
          <input type="text" id="f-category" placeholder="e.g. electronics (optional)" />
        </label>
        <label>
          Max price
          <input type="number" id="f-max-price" placeholder="optional" step="any" />
        </label>
        <button type="submit">Save search</button>
      </form>
    </section>

    <section class="panel" id="searches-panel">
      <div class="panel-header">
        <h2>Saved searches</h2>
        <button id="check-all-btn">Check all</button>
      </div>
      <ul id="saved-search-list"></ul>
    </section>

    <section class="panel" id="ingest-panel">
      <h2>Ingest catalog documents</h2>
      <p class="hint">Select documents from the ingest catalog and add them to the product index.</p>
      <ul id="catalog-list"></ul>
      <button id="ingest-selected-btn">Ingest selected</button>
      <span id="ingest-status"></span>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
