<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Knowledge Base Search</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 16px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: #666; margin-top: 0; margin-bottom: 24px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
  }
  #query-input {
    flex: 1 1 260px;
    padding: 8px 10px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #mode-select {
    padding: 8px 10px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .alpha-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #alpha-slider { width: 140px; }
  #search-button {
    padding: 8px 18px;
    font-size: 1rem;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  #search-button:hover { background: #1d4ed8; }
  #results {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-item {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .result-title { font-weight: 600; }
  .result-score {
    font-variant-numeric: tabular-nums;
    color: #2563eb;
    font-weight: 600;
    margin-left: 12px;
    white-space: nowrap;
  }
  .alpha-wrap.hidden { display: none; }
</style>
</head>
<body>
  <h1>Knowledge Base Search</h1>
  <p class="subtitle">Keyword, semantic, and hybrid search over the knowledge base (powered by Typesense).</p>

  <div class="controls">
    <input type="text" id="query-input" placeholder="Type your search query..." />
    <select id="mode-select">
      <option value="keyword">Keyword</option>
      <option value="semantic">Semantic</option>
      <option value="hybrid">Hybrid</option>
    </select>
    <div class="alpha-wrap" id="alpha-wrap">
      <label for="alpha-slider">alpha: <span id="alpha-value">0.5</span></label>
      <input type="range" id="alpha-slider" min="0" max="1" step="0.1" value="0.5" />
    </div>
    <button id="search-button">Search</button>
  </div>

  <div id="results"></div>

  <script>
    const queryInput = document.getElementById('query-input');
    const modeSelect = document.getElementById('mode-select');
    const alphaSlider = document.getElementById('alpha-slider');
    const alphaValue = document.getElementById('alpha-value');
    const alphaWrap = document.getElementById('alpha-wrap');
    const searchButton = document.getElementById('search-button');
    const resultsContainer = document.getElementById('results');

    function updateAlphaVisibility() {
      alphaWrap.classList.toggle('hidden', modeSelect.value !== 'hybrid');
    }

    alphaSlider.addEventListener('input', () => {
      alphaValue.textContent = alphaSlider.value;
    });
    modeSelect.addEventListener('change', updateAlphaVisibility);
    updateAlphaVisibility();

    async function runSearch() {
      const q = queryInput.value;
      const mode = modeSelect.value;
      const alpha = alphaSlider.value;

      const params = new URLSearchParams({ q, mode, alpha });
      resultsContainer.innerHTML = '<p>Searching...</p>';

      try {
        const res = await fetch('/api/search?' + params.toString());
        const data = await res.json();
        renderResults(data.results || []);
      } catch (err) {
        resultsContainer.innerHTML = '<p>Error: ' + String(err) + '</p>';
      }
    }

    function renderResults(results) {
      resultsContainer.innerHTML = '';
      if (results.length === 0) {
        resultsContainer.innerHTML = '<p>No results.</p>';
        return;
      }
      for (const r of results) {
        const item = document.createElement('div');
        item.className = 'result-item';

        const title = document.createElement('span');
        title.className = 'result-title';
        title.textContent = r.title;

        const score = document.createElement('span');
        score.className = 'result-score';
        score.textContent = Number(r.score).toFixed(4);

        item.appendChild(title);
        item.appendChild(score);
        resultsContainer.appendChild(item);
      }
    }

    searchButton.addEventListener('click', runSearch);
    queryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runSearch();
    });
  </script>
</body>
</html>
