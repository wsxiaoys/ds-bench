<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Multilingual Catalog Search</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    #results { list-style: none; padding: 0; }
    .result-item { padding: 0.5rem; border-bottom: 1px solid #ddd; }
    .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    #search-input { flex: 1; padding: 0.4rem; }
    #language-select { padding: 0.4rem; }
  </style>
</head>
<body>
  <h1>Catalog Search</h1>
  <div class="controls">
    <select id="language-select">
      <option value="en" selected>English</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
    </select>
    <input id="search-input" type="text" placeholder="Search the catalog..." />
  </div>
  <ul id="results"></ul>

  <script>
    (function () {
      const languageSelect = document.getElementById("language-select");
      const searchInput = document.getElementById("search-input");
      const resultsList = document.getElementById("results");

      let requestToken = 0;

      function renderHits(hits) {
        resultsList.textContent = "";
        for (const hit of hits) {
          const li = document.createElement("li");
          li.className = "result-item";
          li.setAttribute("data-doc-id", hit.id);
          li.textContent = hit.name;
          resultsList.appendChild(li);
        }
      }

      async function runSearch() {
        const query = searchInput.value;
        const lang = languageSelect.value;
        const token = ++requestToken;

        if (!query || !query.trim()) {
          renderHits([]);
          return;
        }

        try {
          const url = "/api/search?q=" + encodeURIComponent(query) + "&lang=" + encodeURIComponent(lang);
          const res = await fetch(url);
          const data = await res.json();
          // Ignore stale responses from earlier, slower requests.
          if (token !== requestToken) return;
          renderHits(Array.isArray(data.hits) ? data.hits : []);
        } catch (err) {
          if (token !== requestToken) return;
          renderHits([]);
        }
      }

      searchInput.addEventListener("input", runSearch);
      languageSelect.addEventListener("change", runSearch);
    })();
  </script>
</body>
</html>
