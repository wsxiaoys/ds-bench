<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Typesense Visual Filter Chip Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --and-color: #2563eb;
    --or-color: #d97706;
    --bg: #f4f6f9;
    --panel: #ffffff;
    --border: #d7dde5;
    --text: #1f2937;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .layout {
    display: grid;
    grid-template-columns: minmax(360px, 1fr) minmax(360px, 1fr);
    gap: 20px;
    padding: 20px 24px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .panel h2 { margin-top: 0; font-size: 16px; }

  .group {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 10px;
    margin: 8px 0;
    position: relative;
  }
  .group.and { border-color: var(--and-color); background: rgba(37,99,235,0.04); }
  .group.or  { border-color: var(--or-color);  background: rgba(217,119,6,0.05); }

  .group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .op-toggle {
    display: inline-flex;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .op-toggle button {
    border: none;
    background: #eef1f5;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
  }
  .op-toggle button.active.and { background: var(--and-color); color: white; }
  .op-toggle button.active.or { background: var(--or-color); color: white; }

  .children { display: flex; flex-direction: column; gap: 6px; margin-left: 10px; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #eef2ff;
    border: 1px solid #c7d2fe;
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 13px;
    max-width: 100%;
    flex-wrap: wrap;
  }
  .chip .field { font-weight: 700; color: #3730a3; }
  .chip .cmp { color: #6b21a8; font-style: italic; }
  .chip .val { color: #065f46; font-weight: 600; }
  .chip button.remove {
    border: none;
    background: transparent;
    color: #9ca3af;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
  }
  .chip button.remove:hover { color: #dc2626; }

  .row { display: flex; gap: 6px; }

  .btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
  }
  .btn:hover { background: #f3f4f6; }
  .btn.primary { background: #111827; color: #fff; border-color: #111827; }
  .btn.primary:hover { background: #1f2937; }
  .btn.danger { color: #dc2626; border-color: #fecaca; }
  .btn.small { padding: 3px 8px; font-size: 11px; }

  .add-form {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-top: 8px;
    background: #fbfcfe;
    display: none;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .add-form.open { display: flex; }
  .add-form select, .add-form input {
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .add-form input[type="text"] { min-width: 140px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

  pre#exprPreview {
    background: #0b1021;
    color: #d1e7ff;
    padding: 10px;
    border-radius: 8px;
    font-size: 12.5px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 20px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .count-badge {
    display: inline-block;
    background: #111827;
    color: #fff;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 600;
  }
  .error-box {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>Typesense Visual Filter Chip Builder</h1>
  <p>Compose nested AND / OR groups of condition chips, then apply the filter against the <code>products</code> collection.</p>
</header>

<div class="layout">
  <div class="panel">
    <h2>Filter Tree</h2>
    <div class="toolbar">
      <button class="btn" id="resetTreeBtn">Reset to empty (match all)</button>
    </div>
    <div id="treeRoot"></div>

    <h2 style="margin-top: 18px;">Composed Expression Preview</h2>
    <pre id="exprPreview">(matches every document)</pre>

    <div class="row" style="margin-top: 14px;">
      <button class="btn primary" id="applyBtn">Apply Filter</button>
    </div>
    <div class="error-box" id="errorBox"></div>
  </div>

  <div class="panel">
    <h2>Results</h2>
    <p>Total matches: <span class="count-badge" id="countBadge">-</span></p>
    <table>
      <thead><tr><th>id</th><th>name</th></tr></thead>
      <tbody id="resultsBody"><tr><td colspan="2" class="hint">Apply a filter to see results.</td></tr></tbody>
    </table>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
