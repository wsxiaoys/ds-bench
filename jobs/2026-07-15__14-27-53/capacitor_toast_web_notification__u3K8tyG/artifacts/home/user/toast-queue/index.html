<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toast Queue Manager</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 2rem;
        color: #222;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      .hint {
        color: #666;
        margin-bottom: 1.5rem;
      }
      button {
        margin-right: 0.5rem;
        padding: 0.4rem 0.8rem;
        font-size: 0.95rem;
      }
      pre {
        background: #f4f4f4;
        padding: 0.75rem;
        border-radius: 4px;
        max-width: 720px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>Toast Queue Manager</h1>
    <p class="hint">
      Open the browser console and use
      <code>window.enqueueToast(...)</code>, <code>window.drainToastQueue()</code>,
      and <code>window.getQueueState()</code> to drive the queue.
    </p>
    <div>
      <button id="enqueueSample">Enqueue 3 toasts</button>
      <button id="enqueueBurst">Enqueue 10 toasts</button>
      <button id="drain">Drain</button>
      <button id="state">State</button>
    </div>
    <h3>Log</h3>
    <pre id="log"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
