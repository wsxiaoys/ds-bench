<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session App</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        max-width: 480px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 16px;
      }
      label {
        display: block;
        margin: 8px 0 4px;
        font-size: 0.9rem;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
        font: inherit;
      }
      button {
        font: inherit;
        padding: 8px 14px;
        margin-top: 12px;
        cursor: pointer;
      }
      .field {
        margin-bottom: 8px;
      }
      #status {
        margin-top: 16px;
        font-weight: 600;
      }
      #error {
        margin-top: 8px;
        color: #c0392b;
        min-height: 1.2em;
      }
      pre {
        background: rgba(127, 127, 127, 0.1);
        padding: 8px;
        border-radius: 4px;
        overflow: auto;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BY62xXpH.js"></script>
  </head>
  <body>
    <h1>Capacitor Session Demo</h1>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
    </div>

    <button id="login-btn" type="button">Log in</button>
    <button id="logout-btn" type="button">Log out</button>

    <div id="status">Logged out</div>
    <div id="error"></div>

    <h2>Profile</h2>
    <pre id="profile"></pre>

    <h2>Session cookie</h2>
    <pre id="cookie"></pre>

  </body>
</html>
