<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realtime Leaderboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    .leaderboard-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 30px;
    }
    .leaderboard-header {
      display: grid;
      grid-template-columns: 80px 1fr 120px;
      font-weight: bold;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .leaderboard-row {
      display: grid;
      grid-template-columns: 80px 1fr 120px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      align-items: center;
    }
    .leaderboard-row:last-child {
      border-bottom: none;
    }
    .form-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 20px;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 200px;
    }
    label {
      margin-bottom: 5px;
      font-weight: 600;
      color: #4a5568;
    }
    input {
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      background-color: #3182ce;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 23px;
    }
    button:hover {
      background-color: #2b6cb0;
    }
  </style>
</head>
<body>
  <h1>🏆 Realtime Typesense Leaderboard</h1>

  <div class="leaderboard-container">
    <div class="leaderboard-header">
      <span>Rank</span>
      <span>Player Name</span>
      <span>Score</span>
    </div>
    <div id="leaderboard" data-testid="leaderboard">
      <!-- Live leaderboard rows will be rendered here -->
    </div>
  </div>

  <div class="form-container">
    <h2>Update Player Score</h2>
    <form id="score-form">
      <div class="form-group">
        <label for="player-id">Player ID</label>
        <input type="text" id="player-id" data-testid="player-id-input" placeholder="e.g. p1" required />
      </div>
      <div class="form-group">
        <label for="delta">Score Delta</label>
        <input type="number" id="delta" data-testid="delta-input" placeholder="e.g. 10 or -5" required />
      </div>
      <button type="submit" data-testid="submit-score">Submit Score</button>
    </form>
  </div>

  <script>
    async function refreshLeaderboard() {
      try {
        const res = await fetch('/api/leaderboard');
        if (!res.ok) return;
        const players = await res.json();
        const container = document.querySelector('[data-testid="leaderboard"]');
        if (!container) return;
        
        container.innerHTML = '';
        
        players.forEach(player => {
          const row = document.createElement('div');
          row.setAttribute('data-player-id', player.player_id);
          row.className = 'leaderboard-row';
          
          const rankSpan = document.createElement('span');
          rankSpan.setAttribute('data-testid', 'rank');
          rankSpan.textContent = player.rank;
          
          const nameSpan = document.createElement('span');
          nameSpan.setAttribute('data-testid', 'name');
          nameSpan.textContent = player.name;
          
          const scoreSpan = document.createElement('span');
          scoreSpan.setAttribute('data-testid', 'score');
          scoreSpan.textContent = player.score;
          
          row.appendChild(rankSpan);
          row.appendChild(nameSpan);
          row.appendChild(scoreSpan);
          container.appendChild(row);
        });
      } catch (err) {
        console.error('Error refreshing leaderboard:', err);
      }
    }

    document.getElementById('score-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const playerIdInput = document.querySelector('[data-testid="player-id-input"]');
      const deltaInput = document.querySelector('[data-testid="delta-input"]');
      const playerId = playerIdInput.value.trim();
      const delta = parseInt(deltaInput.value, 10);
      
      if (!playerId || isNaN(delta)) {
        alert('Please enter a valid Player ID and Delta.');
        return;
      }
      
      try {
        const response = await fetch('/api/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ player_id: playerId, delta: delta })
        });
        
        if (response.status === 404) {
          alert('Player not found.');
        } else if (response.status === 400) {
          alert('Invalid input.');
        } else if (response.ok) {
          playerIdInput.value = '';
          deltaInput.value = '';
          await refreshLeaderboard();
        } else {
          alert('Failed to update score.');
        }
      } catch (error) {
        console.error('Error submitting score:', error);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      refreshLeaderboard();
      setInterval(refreshLeaderboard, 1000);
    });
  </script>
</body>
</html>
