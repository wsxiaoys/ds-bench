<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge-Base Search</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      color: #0f172a;
      text-align: center;
    }

    .search-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 1.25rem;
      background: #f1f5f9;
      border-radius: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #475569;
    }

    input[type="text"], select {
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      background: white;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    input[type="range"] {
      flex: 1;
      height: 6px;
      background: var(--border-color);
      border-radius: 3px;
      outline: none;
    }

    .slider-val {
      font-weight: bold;
      min-width: 2.5rem;
      text-align: right;
    }

    button {
      padding: 0.75rem;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    #results {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .result-item {
      padding: 1.25rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: white;
      transition: box-shadow 0.2s;
    }

    .result-item:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .result-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0f172a;
      margin: 0;
    }

    .result-score {
      font-size: 0.85rem;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      white-space: nowrap;
    }

    .result-body {
      font-size: 0.95rem;
      color: #475569;
      line-height: 1.5;
      margin: 0;
    }

    .no-results {
      text-align: center;
      color: #64748b;
      padding: 2rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Knowledge-Base Search</h1>
    
    <div class="search-panel">
      <div class="form-group">
        <label for="query-input">Query</label>
        <input type="text" id="query-input" placeholder="Type your search query here..." value="speed up slow website">
      </div>

      <div class="form-group">
        <label for="mode-select">Search Mode</label>
        <select id="mode-select">
          <option value="keyword">Keyword</option>
          <option value="semantic">Semantic</option>
          <option value="hybrid">Hybrid</option>
        </select>
      </div>

      <div class="form-group" id="alpha-group">
        <label for="alpha-slider">Hybrid Alpha (Semantic Weight)</label>
        <div class="slider-container">
          <input type="range" id="alpha-slider" min="0" max="1" step="0.1" value="0.5">
          <span class="slider-val" id="alpha-value">0.5</span>
        </div>
      </div>

      <button id="search-button">Search</button>
    </div>

    <div id="results">
      <!-- Search results will be loaded here -->
    </div>
  </div>

  <script>
    const queryInput = document.getElementById('query-input');
    const modeSelect = document.getElementById('mode-select');
    const alphaSlider = document.getElementById('alpha-slider');
    const alphaValue = document.getElementById('alpha-value');
    const alphaGroup = document.getElementById('alpha-group');
    const searchButton = document.getElementById('search-button');
    const resultsContainer = document.getElementById('results');

    // Update alpha slider value display
    alphaSlider.addEventListener('input', () => {
      alphaValue.textContent = alphaSlider.value;
    });

    // Toggle alpha slider visibility/enabled state based on mode
    function updateSliderState() {
      if (modeSelect.value === 'hybrid') {
        alphaGroup.style.opacity = '1';
        alphaSlider.disabled = false;
      } else {
        alphaGroup.style.opacity = '0.5';
        alphaSlider.disabled = true;
      }
    }

    modeSelect.addEventListener('change', updateSliderState);
    updateSliderState(); // Initialize

    async function performSearch() {
      const q = queryInput.value;
      const mode = modeSelect.value;
      const alpha = alphaSlider.value;

      resultsContainer.innerHTML = '<div style="text-align: center; padding: 2rem; color: #64748b;">Searching...</div>';

      try {
        const url = `/api/search?q=${encodeURIComponent(q)}&mode=${mode}&alpha=${alpha}`;
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error(`Search failed with status ${res.status}`);
        }
        const data = await res.json();
        renderResults(data.results || []);
      } catch (err) {
        resultsContainer.innerHTML = `<div style="text-align: center; padding: 2rem; color: #ef4444; font-weight: bold;">Error: ${err.message}</div>`;
      }
    }

    function renderResults(results) {
      if (results.length === 0) {
        resultsContainer.innerHTML = '<div class="no-results">No results found matching your query.</div>';
        return;
      }

      resultsContainer.innerHTML = '';
      results.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'result-item';

        const headerEl = document.createElement('div');
        headerEl.className = 'result-header';

        const titleEl = document.createElement('h3');
        titleEl.className = 'result-title';
        titleEl.textContent = item.title;

        const scoreEl = document.createElement('span');
        scoreEl.className = 'result-score';
        // Format score nicely if it's a decimal
        const formattedScore = typeof item.score === 'number' && item.score % 1 !== 0 
          ? item.score.toFixed(4) 
          : item.score;
        scoreEl.textContent = `Score: ${formattedScore}`;

        headerEl.appendChild(titleEl);
        headerEl.appendChild(scoreEl);

        const bodyEl = document.createElement('p');
        bodyEl.className = 'result-body';
        bodyEl.textContent = item.body || '';

        itemEl.appendChild(headerEl);
        if (item.body) {
          itemEl.appendChild(bodyEl);
        }

        resultsContainer.appendChild(itemEl);
      });
    }

    searchButton.addEventListener('click', performSearch);

    // Run initial search
    performSearch();
  </script>
</body>
</html>
