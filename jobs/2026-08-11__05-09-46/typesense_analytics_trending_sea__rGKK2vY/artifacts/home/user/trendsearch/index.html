<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trending Searches Analytics UI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    #search-input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    .result-item {
      padding: 10px;
      border-bottom: 1px solid #ccc;
    }
    .trending-item, .suggestion-item {
      cursor: pointer;
      color: blue;
      text-decoration: underline;
      margin-right: 10px;
      display: inline-block;
    }
    #no-results {
      background-color: #f9f9f9;
      padding: 15px;
      border: 1px solid #ddd;
      margin-top: 20px;
    }
    h3 {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Product Search</h1>
  <form id="search-form" onsubmit="event.preventDefault();">
    <input type="text" id="search-input" placeholder="Search for products...">
  </form>

  <div id="trending-container">
    <h3>Trending Searches:</h3>
    <div id="trending"></div>
  </div>

  <h2>Results</h2>
  <div id="results"></div>

  <div id="no-results" style="display: none;">
    <h3>No results found.</h3>
    <p>Did you mean?</p>
    <div id="suggestions"></div>
  </div>

  <script>
    const searchInput = document.getElementById('search-input');
    const resultsContainer = document.getElementById('results');
    const trendingContainer = document.getElementById('trending');
    const noResultsPanel = document.getElementById('no-results');
    const suggestionsContainer = document.getElementById('suggestions');

    async function loadTrending() {
      try {
        const res = await fetch('/api/trending');
        const data = await res.json();
        trendingContainer.innerHTML = '';
        if (data.trending && data.trending.length > 0) {
          data.trending.forEach(item => {
            const el = document.createElement('span');
            el.className = 'trending-item';
            el.textContent = item.q;
            el.onclick = () => {
              searchInput.value = item.q;
              performSearch(item.q);
            };
            trendingContainer.appendChild(el);
          });
        } else {
          trendingContainer.textContent = 'No trending searches yet.';
        }
      } catch (err) {
        console.error('Error loading trending:', err);
      }
    }

    async function performSearch(query) {
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        // Update results
        resultsContainer.innerHTML = '';
        if (data.found > 0) {
          noResultsPanel.style.display = 'none';
          data.hits.forEach(hit => {
            const el = document.createElement('div');
            el.className = 'result-item';
            el.textContent = hit.name;
            resultsContainer.appendChild(el);
          });
        } else {
          noResultsPanel.style.display = 'block';
          suggestionsContainer.innerHTML = '';
          if (data.suggestions && data.suggestions.length > 0) {
            data.suggestions.forEach(sug => {
              const el = document.createElement('span');
              el.className = 'suggestion-item';
              el.textContent = sug;
              el.onclick = () => {
                searchInput.value = sug;
                performSearch(sug);
              };
              suggestionsContainer.appendChild(el);
            });
          }
        }

        // Refresh trending widget
        await loadTrending();

      } catch (err) {
        console.error('Error performing search:', err);
      }
    }

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        performSearch(searchInput.value);
      }
    });

    // Load trending on page load
    window.onload = () => {
      loadTrending();
    };
  </script>
</body>
</html>
