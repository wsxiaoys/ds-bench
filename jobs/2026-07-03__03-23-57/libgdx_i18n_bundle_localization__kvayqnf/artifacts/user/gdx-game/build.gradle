plugins {
    id 'java'
    id 'application'
}

group = 'com.gdx.game'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url "https://oss.sonatype.org/content/repositories/releases/" }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:1.14.2"
    implementation "com.badlogicgames.gdx:gdx-backend-headless:1.14.2"
    implementation "com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop"
}

sourceSets {
    main {
        resources {
            srcDirs = ["src/main/resources", "assets"]
        }
    }
}

application {
    mainClass = 'com.gdx.game.ConsoleLauncher'
}
