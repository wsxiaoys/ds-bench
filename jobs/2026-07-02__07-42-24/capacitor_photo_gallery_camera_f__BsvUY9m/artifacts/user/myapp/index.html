<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
        color: #333;
      }
      #capture-btn {
        background-color: #007aff;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
      }
      #capture-btn:active {
        background-color: #0056b3;
      }
      #capture-status {
        font-weight: bold;
        margin-left: 10px;
      }
      .status-container {
        margin: 20px 0;
      }
      #gallery-list {
        margin-top: 30px;
        display: flex;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>Photo Gallery</h1>
      <div class="status-container">
        <button id="capture-btn">Capture Photo</button>
        Status: <span id="capture-status">idle</span>
      </div>
      <h2>Gallery</h2>
      <div id="gallery-list"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
