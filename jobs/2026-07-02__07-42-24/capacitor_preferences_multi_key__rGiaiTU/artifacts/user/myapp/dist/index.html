<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KV Admin</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
        background: #f9f9f9;
        color: #333;
      }
      h1 {
        border-bottom: 2px solid #eaeaea;
        padding-bottom: 0.5rem;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      label {
        display: block;
        margin-bottom: 0.25rem;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      button {
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 4px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background-color: #0056b3;
      }
      #kv-remove-btn {
        background-color: #dc3545;
      }
      #kv-remove-btn:hover {
        background-color: #bd2130;
      }
      #kv-clear-btn {
        background-color: #6c757d;
      }
      #kv-clear-btn:hover {
        background-color: #545b62;
      }
      ul {
        list-style-type: none;
        padding: 0;
      }
      li {
        background: white;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-bottom: 0.5rem;
        word-break: break-all;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-DcH0D10h.js"></script>
  </head>
  <body>
    <main id="app">
      <h1>KV Admin</h1>
      <div class="form-group">
        <label for="kv-key">Key</label>
        <input type="text" id="kv-key" placeholder="Enter key name" />
      </div>
      <div class="form-group">
        <label for="kv-value">Value</label>
        <input type="text" id="kv-value" placeholder="Enter value" />
      </div>
      <div class="actions">
        <button id="kv-set-btn">Set</button>
        <button id="kv-remove-btn">Remove</button>
        <button id="kv-clear-btn">Clear All</button>
      </div>
      <h2>Stored Preferences</h2>
      <ul id="kv-list"></ul>
    </main>
  </body>
</html>
