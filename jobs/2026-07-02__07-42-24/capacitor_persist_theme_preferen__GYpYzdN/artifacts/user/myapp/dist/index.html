<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Demo</title>
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #333333;
        --btn-bg: #007bff;
        --btn-color: #ffffff;
      }
      
      html.dark {
        --bg-color: #121212;
        --text-color: #f5f5f5;
        --btn-bg: #ffc107;
        --btn-color: #121212;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        transition: background-color 0.3s, color 0.3s;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      main {
        text-align: center;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        background: rgba(128, 128, 128, 0.05);
      }

      button {
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: bold;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: var(--btn-bg);
        color: var(--btn-color);
        transition: background-color 0.3s, color 0.3s;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-C1Yp6Jef.js"></script>
  </head>
  <body>
    <main id="app">
      <h1>Theme Demo</h1>
      <p>Current Theme: <span id="current-theme-text">light</span></p>
      <button id="theme-toggle">Toggle Theme</button>
    </main>
  </body>
</html>
