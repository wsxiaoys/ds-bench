<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge-Base Search</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f9fafb;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 2rem;
      color: var(--primary-color);
    }

    .search-card {
      background-color: var(--card-bg);
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 2rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border-color);
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    select {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border-color);
      font-size: 1rem;
      background-color: white;
      outline: none;
    }

    select:focus {
      border-color: var(--primary-color);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    input[type="range"] {
      flex-grow: 1;
      accent-color: var(--primary-color);
    }

    .alpha-value {
      font-weight: bold;
      font-size: 1rem;
      min-width: 2rem;
      text-align: right;
    }

    .btn-search {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      padding: 0.875rem;
      border: none;
      border-radius: 0.375rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-search:hover {
      background-color: var(--primary-hover);
    }

    .suggestions {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .suggestion-tag {
      display: inline-block;
      background-color: #e0e7ff;
      color: #3730a3;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      margin-right: 0.5rem;
      margin-top: 0.5rem;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .suggestion-tag:hover {
      background-color: #c7d2fe;
    }

    .results-section {
      background-color: var(--card-bg);
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 2rem;
      border: 1px solid var(--border-color);
    }

    .results-header {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-item {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      transition: background-color 0.2s;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item:hover {
      background-color: #fafafa;
    }

    .result-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
    }

    .result-score {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
      display: inline-block;
      background-color: #f3f4f6;
      padding: 0.125rem 0.5rem;
      border-radius: 0.25rem;
    }

    .error-msg {
      color: #dc2626;
      background-color: #fef2f2;
      border: 1px solid #fca5a5;
      padding: 1rem;
      border-radius: 0.375rem;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem 0;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Knowledge-Base Search</h1>

    <div class="search-card">
      <div class="form-group">
        <label for="query-input">Search Query</label>
        <input type="text" id="query-input" placeholder="Type or select a query..." value="speed up slow website">
        
        <div class="suggestions">
          <strong>Pre-computed queries:</strong><br>
          <span class="suggestion-tag" onclick="setQuery('speed up slow website')">speed up slow website</span>
          <span class="suggestion-tag" onclick="setQuery('how to make my app faster')">how to make my app faster</span>
          <span class="suggestion-tag" onclick="setQuery('store data in tables')">store data in tables</span>
        </div>
      </div>

      <div class="controls-row">
        <div class="form-group">
          <label for="mode-select">Search Mode</label>
          <select id="mode-select">
            <option value="keyword">Keyword</option>
            <option value="semantic">Semantic</option>
            <option value="hybrid">Hybrid</option>
          </select>
        </div>

        <div class="form-group" id="alpha-group">
          <label for="alpha-slider">Hybrid Alpha (Vector Weight)</label>
          <div class="slider-container">
            <input type="range" id="alpha-slider" min="0" max="1" step="0.1" value="0.5">
            <span class="alpha-value" id="alpha-val-display">0.5</span>
          </div>
        </div>
      </div>

      <button id="search-button" class="btn-search">Run Search</button>
    </div>

    <div class="results-section">
      <div class="results-header">
        <span>Search Results</span>
        <span id="results-count" style="font-size: 0.875rem; font-weight: normal; color: var(--text-muted);"></span>
      </div>

      <div id="error-container" style="display: none;"></div>

      <div id="results">
        <div class="no-results">Enter a query and click 'Run Search' to see results.</div>
      </div>
    </div>
  </div>

  <script>
    const queryInput = document.getElementById('query-input');
    const modeSelect = document.getElementById('mode-select');
    const alphaSlider = document.getElementById('alpha-slider');
    const alphaValDisplay = document.getElementById('alpha-val-display');
    const alphaGroup = document.getElementById('alpha-group');
    const searchButton = document.getElementById('search-button');
    const resultsContainer = document.getElementById('results');
    const resultsCount = document.getElementById('results-count');
    const errorContainer = document.getElementById('error-container');

    // Update alpha slider display
    alphaSlider.addEventListener('input', () => {
      alphaValDisplay.textContent = alphaSlider.value;
    });

    // Toggle alpha slider visibility based on mode
    function updateSliderVisibility() {
      if (modeSelect.value === 'hybrid') {
        alphaGroup.style.opacity = '1';
        alphaSlider.disabled = false;
      } else {
        alphaGroup.style.opacity = '0.5';
        alphaSlider.disabled = true;
      }
    }

    modeSelect.addEventListener('change', updateSliderVisibility);
    updateSliderVisibility(); // Initial check

    // Set query from suggestion tag
    window.setQuery = function(text) {
      queryInput.value = text;
    };

    // Perform search
    async function performSearch() {
      const q = queryInput.value.trim();
      const mode = modeSelect.value;
      const alpha = alphaSlider.value;

      if (!q) {
        showError('Please enter a search query.');
        return;
      }

      // Clear previous error and results
      errorContainer.style.display = 'none';
      errorContainer.innerHTML = '';
      resultsContainer.innerHTML = '<div class="no-results">Searching...</div>';
      resultsCount.textContent = '';

      try {
        let url = `/api/search?q=${encodeURIComponent(q)}&mode=${mode}`;
        if (mode === 'hybrid') {
          url += `&alpha=${alpha}`;
        }

        const res = await fetch(url);
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'An error occurred while fetching search results.');
          return;
        }

        renderResults(data);
      } catch (err) {
        showError('Failed to connect to the server. Please try again.');
        console.error(err);
      }
    }

    function showError(msg) {
      errorContainer.className = 'error-msg';
      errorContainer.textContent = msg;
      errorContainer.style.display = 'block';
      resultsContainer.innerHTML = '<div class="no-results">No results due to an error.</div>';
      resultsCount.textContent = '';
    }

    function renderResults(data) {
      const results = data.results || [];
      resultsCount.textContent = `Found ${results.length} result(s) in ${data.mode} mode`;

      if (results.length === 0) {
        resultsContainer.innerHTML = '<div class="no-results">No documents matched your query.</div>';
        return;
      }

      resultsContainer.innerHTML = '';
      results.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'result-item';

        const titleEl = document.createElement('div');
        titleEl.className = 'result-title';
        titleEl.textContent = item.title;

        const scoreEl = document.createElement('div');
        scoreEl.className = 'result-score';
        scoreEl.textContent = `Score: ${item.score}`;

        itemEl.appendChild(titleEl);
        itemEl.appendChild(scoreEl);
        resultsContainer.appendChild(itemEl);
      });
    }

    searchButton.addEventListener('click', performSearch);

    // Run search on Enter key in input
    queryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        performSearch();
      }
    });
  </script>
</body>
</html>
