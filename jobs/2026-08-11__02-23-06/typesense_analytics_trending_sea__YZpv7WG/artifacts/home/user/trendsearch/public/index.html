<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trending Searches Analytics UI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    h1 {
      text-align: center;
    }
    .search-box {
      margin-bottom: 30px;
    }
    #search-input {
      width: 100%;
      padding: 12px 20px;
      font-size: 18px;
      border: 2px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    #search-input:focus {
      outline: none;
      border-color: #007bff;
    }
    .content-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }
    .results-section, .trending-section {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #eee;
    }
    .result-item {
      padding: 10px;
      margin-bottom: 10px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .trending-item {
      padding: 8px 12px;
      margin-bottom: 8px;
      background: #e9ecef;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    .trending-item:hover {
      background: #dee2e6;
    }
    #no-results {
      display: none;
      background: #fff3cd;
      color: #856404;
      padding: 15px;
      border-radius: 4px;
      border: 1px solid #ffeeba;
      margin-bottom: 20px;
    }
    .suggestion-item {
      padding: 6px 12px;
      margin-bottom: 6px;
      background: #fff;
      border: 1px solid #ffeeba;
      border-radius: 4px;
      cursor: pointer;
      display: inline-block;
      margin-right: 8px;
    }
    .suggestion-item:hover {
      background: #fdfdfe;
    }
  </style>
</head>
<body>

  <h1>Product Search</h1>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="Search for products (e.g., Laptop, Phone, Camera)..." autocomplete="off">
  </div>

  <div class="content-layout">
    <div class="main-column">
      <div id="no-results">
        <strong>No results found.</strong> Did you mean:
        <div id="suggestions" style="margin-top: 10px;"></div>
      </div>

      <div class="results-section">
        <h3>Search Results</h3>
        <div id="results"></div>
      </div>
    </div>

    <div class="trending-section">
      <h3>Trending Searches</h3>
      <div id="trending"></div>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('search-input');
    const resultsContainer = document.getElementById('results');
    const trendingContainer = document.getElementById('trending');
    const noResultsPanel = document.getElementById('no-results');
    const suggestionsContainer = document.getElementById('suggestions');

    // Load trending on page load
    window.addEventListener('DOMContentLoaded', () => {
      fetchTrending();
      // Poll trending every 3 seconds to reflect updates
      setInterval(fetchTrending, 3000);
    });

    // Execute query when pressing Enter
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = searchInput.value.trim();
        executeSearch(query);
      }
    });

    async function executeSearch(query) {
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        // Update results
        resultsContainer.innerHTML = '';
        if (data.found > 0) {
          noResultsPanel.style.display = 'none';
          data.hits.forEach(hit => {
            const item = document.createElement('div');
            item.className = 'result-item';
            item.textContent = hit.name;
            resultsContainer.appendChild(item);
          });
        } else {
          noResultsPanel.style.display = 'block';
          suggestionsContainer.innerHTML = '';
          data.suggestions.forEach(sug => {
            const item = document.createElement('span');
            item.className = 'suggestion-item';
            item.textContent = sug;
            item.addEventListener('click', () => {
              searchInput.value = sug;
              executeSearch(sug);
            });
            suggestionsContainer.appendChild(item);
          });
        }

        // Refresh trending immediately
        fetchTrending();
      } catch (err) {
        console.error('Error executing search:', err);
      }
    }

    async function fetchTrending() {
      try {
        const res = await fetch('/api/trending');
        const data = await res.json();

        trendingContainer.innerHTML = '';
        if (data.trending && data.trending.length > 0) {
          data.trending.forEach(item => {
            const el = document.createElement('div');
            el.className = 'trending-item';
            el.innerHTML = `<span>${item.q}</span> <small style="color: #666;">(${item.count})</small>`;
            el.addEventListener('click', () => {
              searchInput.value = item.q;
              executeSearch(item.q);
            });
            trendingContainer.appendChild(el);
          });
        } else {
          trendingContainer.innerHTML = '<div style="color: #666; font-style: italic;">No trending searches yet</div>';
        }
      } catch (err) {
        console.error('Error fetching trending:', err);
      }
    }
  </script>
</body>
</html>
