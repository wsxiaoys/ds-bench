<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Realtime Typesense Leaderboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f4f4f2;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .error {
      color: red;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <h1>Typesense Leaderboard</h1>
  
  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Player ID</th>
        <th>Name</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody data-testid="leaderboard">
      <!-- Rows will be injected here -->
    </tbody>
  </table>

  <h2>Submit Score Change</h2>
  <div id="error-message" class="error"></div>
  <form id="score-form">
    <div class="form-group">
      <label for="player-id">Player ID:</label>
      <input type="text" id="player-id" data-testid="player-id-input" required>
    </div>
    <div class="form-group">
      <label for="delta">Score Delta:</label>
      <input type="number" id="delta" data-testid="delta-input" required>
    </div>
    <button type="submit" data-testid="submit-score">Submit Score</button>
  </form>

  <script>
    async function updateLeaderboard() {
      try {
        const response = await fetch('/api/leaderboard');
        if (!response.ok) throw new Error('Failed to fetch leaderboard');
        const players = await response.json();
        
        const tbody = document.querySelector('[data-testid="leaderboard"]');
        tbody.innerHTML = '';
        
        players.forEach(player => {
          const tr = document.createElement('tr');
          tr.setAttribute('data-player-id', player.player_id);
          
          const rankTd = document.createElement('td');
          rankTd.setAttribute('data-testid', 'rank');
          rankTd.textContent = player.rank;
          
          const nameTd = document.createElement('td');
          nameTd.setAttribute('data-testid', 'name');
          nameTd.textContent = player.name;
          
          const scoreTd = document.createElement('td');
          scoreTd.setAttribute('data-testid', 'score');
          scoreTd.textContent = player.score;
          
          tr.appendChild(rankTd);
          tr.appendChild(nameTd);
          tr.appendChild(scoreTd);
          
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('score-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const playerIdInput = document.getElementById('player-id');
      const deltaInput = document.getElementById('delta');
      const errorDiv = document.getElementById('error-message');
      
      errorDiv.textContent = '';
      
      const player_id = playerIdInput.value.trim();
      const delta = parseInt(deltaInput.value, 10);
      
      try {
        const response = await fetch('/api/score', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ player_id, delta })
        });
        
        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.message || 'Failed to update score');
        }
        
        // Clear input fields
        playerIdInput.value = '';
        deltaInput.value = '';
        
        // Immediately update leaderboard
        await updateLeaderboard();
      } catch (err) {
        errorDiv.textContent = err.message;
      }
    });

    // Initial load
    updateLeaderboard();
    
    // Poll every 1 second (well within the 10 seconds requirement)
    setInterval(updateLeaderboard, 1000);
  </script>
</body>
</html>
