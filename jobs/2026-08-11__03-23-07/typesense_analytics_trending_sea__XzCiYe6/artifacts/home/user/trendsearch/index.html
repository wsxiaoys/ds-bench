<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trending Searches Analytics UI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .search-container {
      margin-bottom: 30px;
    }
    #search-input {
      width: 100%;
      padding: 12px 20px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .layout {
      display: flex;
      gap: 40px;
    }
    .main-content {
      flex: 2;
    }
    .sidebar {
      flex: 1;
      background: #f9f9f9;
      padding: 20px;
      border-radius: 6px;
      border: 1px solid #eee;
    }
    .result-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
    }
    .result-item:last-child {
      border-bottom: none;
    }
    .result-name {
      font-weight: bold;
      font-size: 16px;
    }
    .result-meta {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
    }
    #no-results {
      display: none;
      background: #fff8f8;
      border: 1px solid #ffe0e0;
      padding: 20px;
      border-radius: 6px;
      margin-top: 20px;
    }
    #no-results h3 {
      margin-top: 0;
      color: #c00;
    }
    .suggestion-item {
      padding: 8px 12px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 8px;
      cursor: pointer;
      display: inline-block;
      margin-right: 8px;
    }
    .suggestion-item:hover {
      background: #f0f0f0;
    }
    .trending-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 15px;
    }
    .trending-item:last-child {
      border-bottom: none;
    }
    .trending-item span {
      font-weight: bold;
      color: #0066cc;
    }
  </style>
</head>
<body>

  <h1>Product Search</h1>

  <div class="search-container">
    <form id="search-form">
      <input type="text" id="search-input" placeholder="Search products..." autocomplete="off">
    </form>
  </div>

  <div class="layout">
    <div class="main-content">
      <h2>Search Results</h2>
      <div id="results"></div>

      <div id="no-results">
        <h3>No results found</h3>
        <p>Did you mean?</p>
        <div id="suggestions"></div>
      </div>
    </div>

    <div class="sidebar">
      <h2>Trending Searches</h2>
      <div id="trending"></div>
    </div>
  </div>

  <script>
    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('search-input');
    const resultsContainer = document.getElementById('results');
    const noResultsPanel = document.getElementById('no-results');
    const suggestionsContainer = document.getElementById('suggestions');
    const trendingContainer = document.getElementById('trending');

    // Load trending searches on page load
    async function loadTrending() {
      try {
        const res = await fetch('/api/trending');
        if (res.ok) {
          const data = await res.json();
          renderTrending(data.trending || []);
        }
      } catch (err) {
        console.error('Error loading trending:', err);
      }
    }

    function renderTrending(trending) {
      trendingContainer.innerHTML = '';
      if (trending.length === 0) {
        trendingContainer.innerHTML = '<div style="color: #666; font-style: italic;">No trending searches yet.</div>';
        return;
      }
      trending.forEach(item => {
        const div = document.createElement('div');
        div.className = 'trending-item';
        div.innerHTML = `<span>${escapeHtml(item.q)}</span> (${item.count})`;
        div.style.cursor = 'pointer';
        div.addEventListener('click', () => {
          searchInput.value = item.q;
          performSearch(item.q);
        });
        trendingContainer.appendChild(div);
      });
    }

    // Perform search
    async function performSearch(query) {
      if (!query.trim()) return;
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        if (res.ok) {
          const data = await res.json();
          renderResults(data);
          // Refresh trending widget
          await loadTrending();
        }
      } catch (err) {
        console.error('Error performing search:', err);
      }
    }

    function renderResults(data) {
      resultsContainer.innerHTML = '';
      
      if (data.found > 0) {
        noResultsPanel.style.display = 'none';
        resultsContainer.style.display = 'block';
        
        data.hits.forEach(hit => {
          const div = document.createElement('div');
          div.className = 'result-item';
          div.innerHTML = `
            <div class="result-name">${escapeHtml(hit.name)}</div>
            <div class="result-meta">Category: ${escapeHtml(hit.category || '')} | Price: $${hit.price || ''}</div>
          `;
          resultsContainer.appendChild(div);
        });
      } else {
        resultsContainer.style.display = 'none';
        noResultsPanel.style.display = 'block';
        
        suggestionsContainer.innerHTML = '';
        const suggestions = data.suggestions || [];
        suggestions.forEach(sug => {
          const span = document.createElement('span');
          span.className = 'suggestion-item';
          span.textContent = sug;
          span.addEventListener('click', () => {
            searchInput.value = sug;
            performSearch(sug);
          });
          suggestionsContainer.appendChild(span);
        });
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Handle form submit
    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      performSearch(searchInput.value);
    });

    // Initial load
    loadTrending();
  </script>
</body>
</html>
