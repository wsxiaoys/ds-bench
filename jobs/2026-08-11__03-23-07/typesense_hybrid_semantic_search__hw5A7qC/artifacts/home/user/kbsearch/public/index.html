<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge-Base Search</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f9fafb;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #4b5563;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.125rem;
    }

    .search-panel {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 2rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    input[type="text"], select {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: #fff;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: opacity 0.3s;
    }

    input[type="range"] {
      flex: 1;
      height: 6px;
      background: var(--border-color);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary-color);
      cursor: pointer;
      transition: background 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: var(--primary-hover);
    }

    .alpha-val-display {
      font-weight: bold;
      min-width: 2.5rem;
      text-align: right;
      font-size: 1.1rem;
      color: var(--primary-color);
    }

    #search-button {
      width: 100%;
      padding: 0.875rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    #search-button:hover {
      background-color: var(--primary-hover);
    }

    #search-button:active {
      transform: scale(0.98);
    }

    .results-section {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 2rem;
      border: 1px solid var(--border-color);
    }

    .results-section h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .result-item {
      padding: 1.25rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 1rem;
      background-color: var(--bg-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .result-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .result-item:last-child {
      margin-bottom: 0;
    }

    .result-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .result-score {
      font-size: 0.875rem;
      font-weight: 700;
      background-color: rgba(79, 70, 229, 0.1);
      color: var(--primary-color);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
    }

    .loading, .no-results, .error {
      text-align: center;
      padding: 2rem;
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .error {
      color: #dc2626;
      background-color: #fef2f2;
      border-radius: 8px;
      border: 1px solid #fca5a5;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Knowledge-Base Search</h1>
      <p>Keyword, Semantic, and Hybrid Search powered by Typesense</p>
    </header>

    <main>
      <section class="search-panel">
        <div class="form-group">
          <label for="query-input">Search Query</label>
          <input type="text" id="query-input" placeholder="e.g. speed up slow website" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="mode-select">Search Mode</label>
          <select id="mode-select">
            <option value="keyword">Keyword</option>
            <option value="semantic">Semantic</option>
            <option value="hybrid">Hybrid</option>
          </select>
        </div>

        <div class="form-group" id="alpha-container">
          <label for="alpha-slider">Hybrid Alpha (Keyword vs Semantic weight)</label>
          <div class="slider-container">
            <input type="range" id="alpha-slider" min="0" max="1" step="0.1" value="0.5">
            <span class="alpha-val-display" id="alpha-value">0.5</span>
          </div>
        </div>

        <button id="search-button">Search</button>
      </section>

      <section class="results-section">
        <h2>Search Results</h2>
        <div id="results">
          <div class="no-results">Enter a query and press Search to see results.</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const modeSelect = document.getElementById('mode-select');
    const alphaSlider = document.getElementById('alpha-slider');
    const alphaValue = document.getElementById('alpha-value');
    const alphaContainer = document.getElementById('alpha-container');
    const queryInput = document.getElementById('query-input');
    const searchButton = document.getElementById('search-button');
    const resultsContainer = document.getElementById('results');

    function updateAlphaVisibility() {
      if (modeSelect.value === 'hybrid') {
        alphaSlider.disabled = false;
        alphaContainer.style.opacity = '1';
      } else {
        alphaSlider.disabled = true;
        alphaContainer.style.opacity = '0.5';
      }
    }

    modeSelect.addEventListener('change', updateAlphaVisibility);
    alphaSlider.addEventListener('input', () => {
      alphaValue.textContent = alphaSlider.value;
    });

    async function performSearch() {
      const q = queryInput.value.trim();
      const mode = modeSelect.value;
      const alpha = alphaSlider.value;

      if (!q) {
        resultsContainer.innerHTML = '<div class="no-results">Please enter a search query.</div>';
        return;
      }

      resultsContainer.innerHTML = '<div class="loading">Searching...</div>';

      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(q)}&mode=${mode}&alpha=${alpha}`);
        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || 'Search failed');
        }

        const data = await response.json();
        resultsContainer.innerHTML = '';

        if (data.results.length === 0) {
          resultsContainer.innerHTML = '<div class="no-results">No results found.</div>';
          return;
        }

        data.results.forEach(result => {
          const item = document.createElement('div');
          item.className = 'result-item';

          const title = document.createElement('div');
          title.className = 'result-title';
          title.textContent = result.title;

          const score = document.createElement('div');
          score.className = 'result-score';
          
          // Format score nicely
          const formattedScore = typeof result.score === 'number' && !Number.isInteger(result.score)
            ? result.score.toFixed(4)
            : result.score;
          score.textContent = formattedScore;

          item.appendChild(title);
          item.appendChild(score);
          resultsContainer.appendChild(item);
        });

      } catch (err) {
        resultsContainer.innerHTML = `<div class="error">Error: ${err.message}</div>`;
      }
    }

    searchButton.addEventListener('click', performSearch);
    queryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        performSearch();
      }
    });

    // Initialize on page load
    updateAlphaVisibility();
  </script>
</body>
</html>
