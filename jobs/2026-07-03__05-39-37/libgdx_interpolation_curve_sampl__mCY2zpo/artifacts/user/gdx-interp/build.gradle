plugins {
    id 'application'
}

group 'com.example'
version '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.badlogicgames.gdx:gdx:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-backend-headless:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop'
}

application {
    mainClass = 'com.example.InterpSampler'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Ensure deterministic, headless run: no GUI, no OpenGL.
applicationDefaultJvmArgs = ['-Djava.awt.headless=true']

tasks.named('run') {
    // Forward all args passed via --args to the application.
    standardInput = System.in
}