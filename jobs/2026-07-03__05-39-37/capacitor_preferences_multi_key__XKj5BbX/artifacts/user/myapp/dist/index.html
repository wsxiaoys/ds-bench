<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KV Admin</title>
    <script type="module" crossorigin src="/assets/index-BiMws3vE.js"></script>
  </head>
  <body>
    <main id="app">
      <h1>KV Admin</h1>
      <p>Manage persistent key/value pairs stored with <code>@capacitor/preferences</code>.</p>

      <div class="kv-form">
        <label for="kv-key">Key</label>
        <input id="kv-key" type="text" placeholder="key" />

        <label for="kv-value">Value</label>
        <input id="kv-value" type="text" placeholder="value" />

        <div class="kv-actions">
          <button id="kv-set-btn" type="button">Set</button>
          <button id="kv-remove-btn" type="button">Remove</button>
          <button id="kv-clear-btn" type="button">Clear All</button>
        </div>
      </div>

      <h2>Stored pairs</h2>
      <ul id="kv-list"></ul>
    </main>
  </body>
</html>
