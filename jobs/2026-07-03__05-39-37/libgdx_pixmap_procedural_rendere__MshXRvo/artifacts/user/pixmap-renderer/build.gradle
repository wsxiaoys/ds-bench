plugins {
    id 'application'
}

group = 'com.pixmaprenderer'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    // The Docker image ships a populated Gradle cache; mavenLocal/mavenCentral
    // are only consulted as a fallback and remain usable offline once cached.
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'com.badlogicgames.gdx:gdx:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-backend-headless:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop'
}

application {
    mainClass = 'com.pixmaprenderer.Main'
    // Forward CLI args straight through to the application.
    applicationDefaultJvmArgs = ['-Djava.awt.headless=true']
}

// Make `gradle run` forward positional args verbatim to main(String[]).
run {
    // Gradle's `run --args="..."` already populates args; nothing extra needed.
    // We keep standardInput wired so the headless app never blocks on stdin.
    standardInput = System.in
}