name: project
prefect-version: 3.7.6

build: null

push: null

pull:
- prefect.deployments.steps.set_working_directory:
    directory: /home/user/project

deployments:
- name: docker-deployment
  version: null
  tags: []
  description: Print a greeting message from inside a Docker container.
  entrypoint: flow.py:hello_docker_flow
  parameters: {}
  work_pool:
    name: my-docker-pool
    work_queue_name: default
    job_variables:
      image: my-prefect-image:latest
  schedules: []