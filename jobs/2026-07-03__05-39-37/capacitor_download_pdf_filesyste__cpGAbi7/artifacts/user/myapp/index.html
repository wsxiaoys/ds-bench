<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filesystem Demo</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 2rem REDACTED;
        max-width: 42rem;
        padding: 0 1rem;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }
      button {
        padding: 0.6rem 1.1rem;
        font-size: 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      dl {
        margin-top: 1.25rem;
        display: grid;
        grid-template-columns: 8rem 1fr;
        gap: 0.4rem 1rem;
      }
      dt {
        font-weight: 600;
      }
      dd {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }
      #download-status.idle {
        color: #6b7280;
      }
      #download-status.downloading {
        color: #2563eb;
      }
      #download-status.saved {
        color: #059669;
      }
      #download-status.error {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>Filesystem Demo</h1>
      <p>
        Downloads <code>/sample.pdf</code> over HTTP and persists it through
        the Capacitor Filesystem plugin to <code>Directory.Documents</code>,
        then reads it back to verify the saved copy.
      </p>
      <button id="download-pdf" type="button">Download &amp; Save PDF</button>
      <dl>
        <dt>Status</dt>
        <dd><span id="download-status" class="idle">idle</span></dd>
        <dt>File size</dt>
        <dd id="file-size">&mdash;</dd>
        <dt>SHA-256</dt>
        <dd id="file-sha256">&mdash;</dd>
      </dl>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
