<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"url": "https://cdn.jsdelivr.net/npm/vega-datasets@v3.2.1/data/barley.json"}, "facet": {"row": {"field": "year", "title": "Year", "type": "ordinal"}}, "spec": {"layer": [{"mark": {"type": "bar"}, "encoding": {"color": {"field": "variety", "legend": {"title": "Variety"}, "scale": {"scheme": "tableau10"}, "title": "Variety", "type": "nominal"}, "tooltip": [{"field": "site", "title": "Site", "type": "nominal"}, {"field": "variety", "title": "Variety", "type": "nominal"}, {"aggregate": "mean", "field": "yield", "format": ".2f", "title": "Mean Yield", "type": "quantitative"}], "x": {"field": "site", "sort": {"field": "yield", "op": "mean", "order": "descending"}, "title": "Site", "type": "nominal"}, "xOffset": {"field": "variety", "type": "nominal"}, "y": {"aggregate": "mean", "field": "yield", "title": "Mean Yield", "type": "quantitative"}}}, {"mark": {"type": "tick", "color": "black", "orient": "horizontal", "size": 18, "thickness": 2.5}, "encoding": {"tooltip": [{"field": "site", "title": "Site", "type": "nominal"}, {"field": "year", "title": "Year", "type": "ordinal"}, {"field": "site_mean", "format": ".2f", "title": "Site Mean Yield", "type": "quantitative"}], "x": {"field": "site", "sort": {"field": "yield", "op": "mean", "order": "descending"}, "type": "nominal"}, "y": {"field": "site_mean", "title": "Mean Yield", "type": "quantitative"}}, "transform": [{"aggregate": [{"op": "mean", "field": "yield", "as": "site_mean"}], "groupby": ["site", "year"]}]}], "height": 220, "width": 640}, "title": {"text": "Barley Yield by Site and Variety", "anchor": "start", "subtitle": "Grouped mean yield per (site, variety), faceted by year, with the per-site average overlaid as a tick"}, "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json"};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
