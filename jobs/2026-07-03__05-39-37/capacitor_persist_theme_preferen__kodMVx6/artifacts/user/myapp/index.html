<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Demo</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --card-bg: #f5f5f5;
        --border: #d0d0d0;
      }
      :root[data-theme="dark"] {
        --bg: #1a1a1a;
        --fg: #f5f5f5;
        --card-bg: #2a2a2a;
        --border: #444444;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      body {
        background-color: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 2rem 2.5rem;
        text-align: center;
        max-width: 90vw;
      }
      h1 {
        margin-top: 0;
      }
      #theme-toggle {
        margin-top: 1rem;
        padding: 0.6rem 1.4rem;
        font-size: 1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background-color: var(--bg);
        color: var(--fg);
        cursor: pointer;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      #theme-toggle:hover {
        opacity: 0.85;
      }
      .theme-label {
        margin-top: 0.75rem;
        font-size: 0.9rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main id="app" class="card">
      <h1>Theme Demo</h1>
      <p>Toggle between light and dark themes.</p>
      <button id="theme-toggle" type="button">Switch to Dark</button>
      <p class="theme-label">Current theme: <span id="theme-name">light</span></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
