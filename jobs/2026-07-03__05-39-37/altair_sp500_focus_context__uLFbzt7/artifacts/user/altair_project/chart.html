<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "vconcat": [{"layer": [{"mark": {"type": "area", "color": "steelblue", "line": {"color": "steelblue"}}, "encoding": {"x": {"field": "date", "scale": {"domain": {"param": "param_c97a99acfc68b794"}}, "type": "temporal"}, "y": {"field": "price", "scale": {"zero": false}, "type": "quantitative"}}}, {"mark": {"type": "rule", "color": "firebrick", "strokeDash": [6, 4], "strokeWidth": 2}, "encoding": {"tooltip": [{"field": "max_price", "title": "Running max price", "type": "quantitative"}], "y": {"field": "max_price", "type": "quantitative"}}, "transform": [{"filter": {"param": "param_c97a99acfc68b794"}}, {"aggregate": [{"op": "max", "field": "price", "as": "max_price"}]}]}], "height": 400}, {"mark": {"type": "area", "color": "lightsteelblue"}, "encoding": {"x": {"field": "date", "type": "temporal"}, "y": {"field": "price", "scale": {"zero": false}, "type": "quantitative"}}, "height": 60, "name": "view_7bb73d7d75e9d893_1"}], "data": {"url": "https://cdn.jsdelivr.net/npm/vega-datasets@v1.29.0/data/sp500.csv"}, "params": [{"name": "param_c97a99acfc68b794", "select": {"type": "interval", "encodings": ["x"]}, "views": ["view_7bb73d7d75e9d893_1"]}], "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json"};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
