<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session App</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 480px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.4rem;
      }
      fieldset {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      label {
        display: block;
        margin: 0.5rem 0 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        font-size: 1rem;
        box-sizing: border-box;
      }
      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        font-size: 1rem;
        cursor: pointer;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .muted {
        color: #666;
        font-size: 0.9rem;
      }
      #error {
        color: #b00020;
        min-height: 1.25rem;
      }
      dl {
        margin: 0;
      }
      dt {
        font-weight: 600;
        margin-top: 0.5rem;
      }
      dd {
        margin: 0 0 0 0;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>Capacitor Session Demo</h1>

    <fieldset>
      <legend>Login</legend>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <div class="row">
        <button id="login-btn" type="button">Log in</button>
        <button id="logout-btn" type="button">Log out</button>
      </div>
      <p id="error"></p>
    </fieldset>

    <fieldset>
      <legend>Session</legend>
      <dl>
        <dt>Status</dt>
        <dd id="status">Logged out</dd>
        <dt>Profile</dt>
        <dd id="profile"></dd>
        <dt>Session cookie</dt>
        <dd id="cookie"></dd>
      </dl>
    </fieldset>

    <p class="muted">
      Valid demo users: <code>demo</code> / <code>capacitor</code> and
      <code>alice</code> / <code>wonderland</code>.
    </p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
