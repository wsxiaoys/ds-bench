<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toast Queue Manager</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 640px;
        margin: 40px auto;
        padding: 0 20px;
        background: #fafafa;
        color: #222;
      }
      h1 { margin-bottom: 8px; }
      .subtitle { color: #666; margin-bottom: 24px; }
      .card {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
      }
      label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 14px; }
      input, select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
        margin-bottom: 12px;
      }
      button {
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 10px 18px;
        font-size: 14px;
        cursor: pointer;
        margin-right: 8px;
      }
      button:hover { background: #4338ca; }
      button.secondary { background: #6b7280; }
      button.secondary:hover { background: #4b5563; }
      .state {
        font-family: monospace;
        font-size: 14px;
        background: #f3f4f6;
        padding: 10px 14px;
        border-radius: 6px;
        margin-top: 12px;
      }
      .log {
        font-family: monospace;
        font-size: 13px;
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 12px;
        border-radius: 6px;
        margin-top: 12px;
        max-height: 200px;
        overflow-y: auto;
        white-space: pre-wrap;
      }

      /* pwa-toast element styling — positioned by data-position attribute */
      pwa-toast {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(40, 40, 40, 0.92);
        color: #fff;
        padding: 14px 28px;
        border-radius: 8px;
        font-size: 15px;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 99999;
        white-space: nowrap;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }
      pwa-toast[data-position="top"] {
        top: 24px;
      }
      pwa-toast[data-position="center"] {
        top: 50%;
        transform: translate(-50%, -50%);
      }
      pwa-toast[data-position="bottom"] {
        bottom: 24px;
      }
    </style>
  </head>
  <body>
    <h1>Toast Queue Manager</h1>
    <p class="subtitle">Built on top of @capacitor/toast web implementation</p>

    <div class="card">
      <h3>Enqueue a Toast</h3>
      <label for="toast-text">Text</label>
      <input id="toast-text" type="text" value="Hello, World!" />
      <label for="toast-duration">Duration (ms)</label>
      <input id="toast-duration" type="text" value="2000" />
      <label for="toast-position">Position</label>
      <select id="toast-position">
        <option value="bottom">bottom</option>
        <option value="center">center</option>
        <option value="top">top</option>
      </select>
      <div style="margin-top: 8px;">
        <button id="btn-enqueue">Enqueue Toast</button>
        <button id="btn-burst" class="secondary">Burst (5 toasts)</button>
        <button id="btn-drain" class="secondary">Drain Queue</button>
      </div>
    </div>

    <div class="card">
      <h3>Queue State</h3>
      <div id="state" class="state">{ pending: 0, active: false }</div>
    </div>

    <div class="card">
      <h3>Event Log</h3>
      <div id="log" class="log"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
